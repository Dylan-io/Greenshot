.en-field label{display:block;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--fern);margin-bottom:8px}
.en-inwrap{position:relative;display:flex;align-items:center}
.en-inwrap .ic-lead{flex:none;position:absolute;left:14px;color:var(--lichen);pointer-events:none}
.en-inwrap .ic-lead .ic{width:18px;height:18px;stroke-width:1.9}
.en-field input{width:100%;min-height:50px;padding:13px 46px 13px 44px;border-radius:14px;
  background:var(--panel);border:1px solid var(--line-2);color:var(--bone);font-size:15px;font-family:inherit}
.en-field input::placeholder{color:var(--lichen)}
.en-field input:hover{border-color:rgba(242,245,235,.2)}
.en-field input:focus{outline:none;border-color:var(--sprout);box-shadow:0 0 0 3px rgba(104,239,63,.18)}
.en-field.err input{border-color:var(--danger);box-shadow:0 0 0 3px rgba(255,116,82,.15)}
.en-msg{min-height:16px;margin-top:7px;font-size:12.5px;color:var(--danger)}
.en-hint{margin-top:7px;font-size:12px;color:var(--lichen)}
.en-eye{position:absolute;right:6px;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
  background:none;border:0;color:var(--fern);cursor:pointer}
.en-eye:hover{background:var(--panel-2);color:var(--bone)}
.en-eye .ic{width:18px;height:18px;stroke-width:1.9}
/* Le prefixe pays est un choix unique : le Burundi ouvre la liste. */
.en-pref{display:flex;align-items:center;gap:8px;padding:13px 14px;min-height:50px;border-radius:14px;
  background:var(--panel);border:1px solid var(--line-2);color:var(--bone);font-size:14.5px;font-family:inherit;cursor:pointer;
  transition:border-color var(--dur-1)}
.en-pref:hover{border-color:rgba(242,245,235,.2)}
.en-pref .ic{width:17px;height:17px;stroke-width:1.9;color:var(--lichen);margin-left:auto}
.en-phone{display:flex;gap:10px}
.en-phone .en-pref{flex:none;width:118px;justify-content:center}

/* Pseudo : genere, puis personnalisable. */
.en-handle{display:flex;align-items:center;gap:9px;margin-top:26px;padding:15px 16px;border-radius:16px;
  background:var(--panel);border:1px solid var(--line-2)}
.en-handle .ic{width:19px;height:19px;stroke-width:1.9;color:var(--sprout);flex:none}
.en-handle input{flex:1;min-width:0;border:0;background:none;color:var(--bone);font-size:17px;font-weight:600;padding:0}
.en-handle input:focus{outline:none}
.en-handle em{font-style:normal;font-size:20px;color:var(--lichen)}
.en-ok{display:flex;align-items:center;gap:7px;margin-top:11px;font-size:12.5px;color:var(--sprout)}
.en-ok .ic{width:15px;height:15px;stroke-width:2.4}
.en-ok.taken{color:var(--danger)}
.en-alts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.en-alt{padding:8px 13px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line-2);
  color:var(--bone);font-size:13px;font-family:inherit;cursor:pointer;transition:background var(--dur-1),border-color var(--dur-1)}
.en-alt:hover{background:#27422b;border-color:rgba(104,239,63,.45)}

/* Avatar : grille+ligne, la photo reste une option, pas un etage. */
.en-avgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:26px}
.en-avbtn{aspect-ratio:1;border-radius:50%;background:var(--panel);border:2px solid var(--line-2);overflow:hidden;
  cursor:pointer;padding:0;position:relative;transition:border-color var(--dur-1),transform var(--dur-1)}
.en-avbtn img{width:100%;height:100%;object-fit:cover;display:block}
.en-avbtn:hover{transform:scale(1.05);border-color:rgba(104,239,63,.5)}
.en-avbtn[aria-pressed="true"]{border-color:var(--sprout);box-shadow:0 0 0 3px rgba(104,239,63,.2)}
/* La carte de preview : le texte a besoin d'air, et le badge de niveau
   doit etre un disque a part, sinon il mord sur l'avatar. */
.en-avprev{display:flex;align-items:center;gap:16px;margin-top:24px;padding:16px 18px;border-radius:18px;
  background:var(--panel);border:1px solid var(--line-2)}
.en-avprev .apv{position:relative;flex:none;line-height:0}
.en-avprev .apv img,.en-avprev .apv svg{width:64px;height:64px;border-radius:50%;display:block}
.en-avprev .apv .lvl{position:absolute;right:-5px;bottom:-5px;min-width:24px;height:24px;padding:0 6px;
  border-radius:99px;display:grid;place-items:center;font-size:11px;line-height:1;font-weight:700;
  background:var(--sprout);color:#0b160c;border:2.5px solid var(--panel);box-sizing:border-box}
.en-photo{flex:none;min-height:44px;padding:11px 15px;border-radius:12px;background:var(--panel-2);
  border:1px solid var(--line-2);color:var(--bone);font-size:13.5px;font-family:inherit;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px}
.en-photo:hover{background:#27422b;border-color:rgba(104,239,63,.45)}
.en-photo .ic{width:16px;height:16px;stroke-width:2}

@media (min-width:921px){
  /* Sur grand ecran le parcours est une colonne centree, pas une page
     etiree sur 1250 px : une ligne de 90 caracteres ne se lit pas. */
  #entry.ed{background:var(--forest-3)}
  #entry.ed::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(80% 60% at 50% 0%,rgba(104,239,63,.07),rgba(104,239,63,0) 70%)}
  #entry.ed .en{max-width:520px;margin:0 auto;left:0;right:0;top:0;bottom:0;position:absolute;
    border-left:1px solid var(--line);border-right:1px solid var(--line);background:var(--forest-3)}
  #entry.ed .en-splash{max-width:none;border:0;background:radial-gradient(120% 78% at 50% 42%,#16301d,#080f09 78%)}
  .en-body{padding:34px 40px 8px}
  .en-foot{padding:16px 40px 30px}
  .en-body h2{font-size:30px}
}
@media (prefers-reduced-motion:reduce){
  .sp-mark,.sp-word,.sp-tag,.en-body{animation:none}
  .sp-bar i{animation:none;width:100%}
}

}

}

}

}

</style>
</head>
<body>
<div id="app">
  <div id="entry" aria-live="polite"></div>
  <main class="app-main" id="main" role="main"></main>
  <nav class="app-nav" id="nav" aria-label="Navigation principale"></nav>
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Détails"></div>
  <div class="pop" id="pop" role="dialog" aria-modal="true" aria-label="Modifier mon avatar"></div>
  <div class="celebrate" id="celebrate" role="status" aria-live="polite"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <button class="fab-assistant" id="fabAssistant" type="button" aria-label="Ouvrir l’assistant Green" data-od-id="fab-assistant" aria-expanded="false">
    <span class="fab-badge" id="fabBadge" aria-hidden="true"></span>
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a4 4 0 0 1 4 4v3a4 4 0 0 1-8 0V7a4 4 0 0 1 4-4z"/><path d="M4 11v1a8 8 0 0 0 16 0v-1M12 20v2M9 22h6"/></svg>
  </button>
  <div id="assistant" role="dialog" aria-modal="true" aria-label="Assistant Green" data-od-id="assistant-panel">
    <div class="as-scrim" id="asScrim"></div>
    <div class="as-panel">
      <div class="as-grip"></div>
      <div class="as-head">
        <span class="as-av"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 3 4 4.5 4 8a4 4 0 0 1-8 0c0-1.5.6-2.5 1.5-3.5C10.2 6.3 11.6 5 12 3z"/></svg></span>
        <span class="as-who"><b>Green</b><span>Assistant Greenshot · lit vos données</span></span>
        <button class="iconbtn" id="asClose" type="button" aria-label="Fermer l’assistant">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="as-log" id="asLog" aria-live="polite"></div>
      <div class="as-opts" id="asOpts"></div>
      <form class="as-bar" id="asForm">
        <input class="input" id="asInput" type="text" placeholder="Ou écrivez votre réponse…" aria-label="Votre réponse à l’assistant" autocomplete="off">
        <button class="as-send" type="submit" aria-label="Envoyer">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l16-8-6 16-3-6-7-2z"/></svg>
        </button>
      </form>
      <p class="as-note">Green lit votre profil, vos défis et vos signalements. Il propose, vous validez.</p>
    </div>
  </div>
</div>

<script src="assets/avatars/parts.js"></script>
<script>
const ICONS = {
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M9.5 20v-5h5v5"/>',
  map:'<path d="M9 3 3 5.5v15L9 18l6 3 6-2.5v-15L15 6 9 3z"/><path d="M9 3v15M15 6v15"/>',

  user:'<circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/>',

  glass:'<path d="M8 3h8l-1 5a3 3 0 0 1-3 2.5A3 3 0 0 1 9 8L8 3z"/><path d="M12 10.5V20M8.5 20h7"/>',
  cig:'<path d="M3 16h13v3H3z"/><path d="M17.5 16H20v3h-2.5z"/><path d="M17 7c1.5 1 1.5 3 0 4M20 6c2 1.4 2 4.6 0 6"/>',
  sofa:'<path d="M5 12V9a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v3"/><path d="M3 12h18v5H3z"/><path d="M6 17v2M18 17v2"/>',
  box:'<path d="M3.5 8 12 4l8.5 4-8.5 4-8.5-4z"/><path d="M3.5 8v8L12 20l8.5-4V8"/><path d="M12 12v8"/>',

  spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/><path d="M18.5 16.5l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7.7-2z"/>',
  pin:'<path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  bell:'<path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6z"/><path d="M10.5 19a1.5 1.5 0 0 0 3 0"/>',
  camera:'<path d="M4 8h3l1.5-2h7L17 8h3v11H4V8z"/><circle cx="12" cy="13" r="3.2"/>',
  image:'<rect x="3.5" y="5" width="17" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-4 4 3 3-2 4 3"/>',
  filter:'<path d="M4 6h16M7 12h10M10 18h4"/>',
  clock:'<circle cx="12" cy="12" r="8"/><path d="M12 8v4.5l3 1.8"/>',
  star:'<path d="M12 4l2.3 5 5.2.7-3.8 3.6.9 5.2L12 16l-4.6 2.5.9-5.2L4.5 9.7l5.2-.7L12 4z"/>',
  shield:'<path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/>',
  flame:'<path d="M12 3c1 3 4 4.5 4 8a4 4 0 0 1-8 0c0-1.5.6-2.5 1.5-3.5C10.2 6.3 11.6 5 12 3z"/>',
  reward:'<circle cx="12" cy="9" r="5"/><path d="M8.5 13 7 21l5-2.5L17 21l-1.5-8"/>',
  refresh:'<path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v4h-4"/>',
  info:'<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/>',
  medal:'<circle cx="12" cy="14" r="5"/><path d="M9 3l2 5M15 3l-2 5M12 12v4"/>',
  bolt:'<path d="M13 3 5 13h6l-1 8 8-10h-6l1-8z"/>',
  send:'<path d="M4 12l16-8-6 16-3-6-7-2z"/>',
  list:'<path d="M4 6h16M4 12h16M4 18h10"/>',
  target:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18z"/>',
  download:'<path d="M12 4v10m0 0 4-4m-4 4-4-4"/><path d="M5 18h14"/>',
  lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8.5 11V8a3.5 3.5 0 0 1 7 0v3"/>',
  eye:'<path d="M2.5 12S6 6 12 6s9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="2.8"/>',
  mail:'<rect x="3" y="6" width="18" height="12" rx="2"/><path d="m3.5 7.5 8.5 6 8.5-6"/>',
  phone:'<rect x="7" y="3" width="10" height="18" rx="2.4"/><path d="M11 18h2"/>',
  layers:'<path d="M3 7.5 12 3.5l9 4-9 4-9-4z"/><path d="M3 12.5 12 16.5l9-4M3 17.2 12 21.2l9-4"/>'
};
const ic = (n, c) => '<svg class="ic ' + (c || '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[n] + '</svg>';
function tint(hex, a){ const h = hex.replace('#',''); const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16); return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')'; }

const TYPES = {
  menagers:{ label:'Déchets ménagers', short:'Ménagers', icon:'bag', points:20, color:'#68ef3f', shape:'teardrop' },
  plastique:{ label:'Plastique', short:'Plastique', icon:'bottle', points:20, color:'#4fd6e0', shape:'diamond' },
  verre:{ label:'Verre', short:'Verre', icon:'glass', points:25, color:'#7f9cf5', shape:'circle' },
  megots:{ label:'Mégots', short:'Mégots', icon:'cig', points:15, color:'#f2c14e', shape:'triangle' },
  encombrants:{ label:'Encombrants', short:'Encombrants', icon:'sofa', points:40, color:'#e08a5b', shape:'square' },
  papiers:{ label:'Papiers & cartons', short:'Papiers', icon:'box', points:20, color:'#c48fe0', shape:'hex' }
};
const STATUS = {
  open:{ label:'À nettoyer', cls:'st-open' },
  prog:{ label:'Réservé', cls:'st-prog' },
  done:{ label:'Nettoyé', cls:'st-done' }
};
const AVATARS = {
  sprout:{ label:'Plume', seed:'camille', who:'Camille', bg:'#1d3a2a' },
  leaf:{ label:'Feuille', seed:'lea', who:'Léa M.', bg:'#1e4034' },
  drop:{ label:'Goutte', seed:'yanis', who:'Yanis B.', bg:'#22384a' },
  flower:{ label:'Fleur', seed:'nadia', who:'Nadia K.', bg:'#3a2a44' },
  tree:{ label:'Canopée', seed:'aline', who:'Aline', bg:'#20402e' },
  sun:{ label:'Soleil', seed:'sofia', who:'Sofia R.', bg:'#40351f' },
  seed:{ label:'Graine', seed:'tom', who:'Tom V.', bg:'#243a2c' },
  mountain:{ label:'Crête', seed:'marc', who:'Marc D.', bg:'#2c3a30' },
  gem:{ label:'Éclat', seed:'eric', who:'Éric N.', bg:'#1f3546' },
  wave:{ label:'Vague', seed:'benevole', who:'Bénévole', bg:'#33402a' }
};
const AVATAR_KEYS = Object.keys(AVATARS);
function avOf(n){ return AVATARS[n] || AVATARS.sprout; }

/* ── Avatar personnalisable ────────────────────────────────────────
   Les calques viennent de assets/avatars/parts.js (Avatar Illustration
   System de Micah Lanier, CC BY 4.0), découpés en fond / peau / cheveux /
   chemise / bouche. Les couleurs sont injectées ici : chaque personne
   compose son propre avatar, sans ressource distante. */
const AV_HAIR = [
  { id:'pixie', label:'Pixie' }, { id:'mrT', label:'Boucles' }, { id:'full', label:'Longs' },
  { id:'fonze', label:'Ondulés' }, { id:'turban', label:'Turban' }, { id:'mrClean', label:'Court' },
  { id:'dougFunny', label:'Frange' }, { id:'dannyPhantom', label:'Raide' }
];
const AV_FACE = [
  { id:'smile', label:'Sourire' }, { id:'laughing', label:'Rire' }, { id:'surprised', label:'Surprise' },
  { id:'sad', label:'Triste' }, { id:'nervous', label:'Inquiet' }
];
const AV_SKIN = [
  { id:'deep', label:'Peau foncée', hex:'#6f4327' }, { id:'warm', label:'Peau mate', hex:'#8a5533' },
  { id:'tan', label:'Peau halée', hex:'#a9713f' }, { id:'light', label:'Peau claire', hex:'#c68f5f' },
  { id:'pale', label:'Peau très claire', hex:'#e0b183' }
];
const AV_HAIRCOL = [
  { id:'noir', label:'Noir', hex:'#1b1b1b' }, { id:'brun', label:'Brun', hex:'#4a2c17' },
  { id:'chataign', label:'Châtain', hex:'#7a4a24' }, { id:'blond', label:'Blond', hex:'#c99a4e' },
  { id:'rouge', label:'Auburn', hex:'#8c3a1c' }, { id:'gris', label:'Gris', hex:'#8d8d8d' }
];
const AV_SHIRT = [
  { id:'sprout', label:'Vert Greenshot', hex:'#68ef3f' }, { id:'verdant', label:'Vert profond', hex:'#26a200' },
  { id:'bone', label:'Blanc', hex:'#f2f5eb' }, { id:'spruce', label:'Bleu sapin', hex:'#2f6f8f' },
  { id:'clay', label:'Argile', hex:'#b8542f' }, { id:'plum', label:'Prune', hex:'#5a3a72' }
];
const AV_LOOK_DEFAULT = { hair:'mrT', face:'smile', skin:'warm', hairCol:'noir', shirt:'sprout', photo:null };

function avLook(){ return Object.assign({}, AV_LOOK_DEFAULT, state.user.look || {}); }
function avIdOf(v){ return AV_HAIR.concat(AV_FACE, AV_SKIN, AV_HAIRCOL, AV_SHIRT).find(o => o.id === v) || { hex:'#68ef3f', label:'' }; }

/* Rend l'avatar en SVG inline : une seule balise, aucune requête réseau. */
function avatarSVG(look, alt){
  const P = window.AV_PARTS;
  const hair = (P.hair[look.hair] || P.hair.pixie);
  const face = (P.expr[look.face] || P.expr.smile);
  const bg = mixHex(avIdOf(look.shirt).hex, '#0a1509', .82);
  const put = (s) => s.replace(/\{\{BG\}\}/g, bg)
    .replace(/\{\{SKIN\}\}/g, avIdOf(look.skin).hex)
    .replace(/\{\{HAIR\}\}/g, avIdOf(look.hairCol).hex)
    .replace(/\{\{SHIRT\}\}/g, avIdOf(look.shirt).hex);
  const c = P.const.map(put);
  return '<svg viewBox="0 0 360 360" role="img" aria-label="' + (alt || 'Votre avatar') + '">' +
    c[0] + c[1] + put(face) + c[2] + put(hair) + c[3] + c[4] + c[5] + c[6] + '</svg>';
}
function mixHex(a, b, k){
  const p = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
  const A = p(a), B = p(b);
  return '#' + A.map((v,i) => Math.round(v + (B[i] - v) * k).toString(16).padStart(2,'0')).join('');
}
function avatarImg(n, alt){
  if (n && typeof n === 'object'){
    return n.photo
      ? '<img class="pf-photo" src="' + n.photo + '" width="360" height="360" alt="' + (alt || 'Votre photo de profil') + '">'
      : avatarSVG(n, alt);
  }
  const a = avOf(n);
  return '<img src="assets/avatars/avatar-' + a.seed + '.svg" width="360" height="360" alt="' + (alt || ('Avatar ' + a.label)) + '" loading="lazy" decoding="async">';
}
function avatarChip(n, cls, lvl){
  const a = (n && typeof n === 'object') ? null : avOf(n);
  const lvlHtml = (typeof lvl === 'number' && lvl > 0)
    ? '<span class="av-lvl">Niv. ' + lvl + '</span>' : '';
  return '<span class="av-wrap ' + (cls || '') + '"' + (a ? ' style="--av-bg:' + a.bg + '"' : '') + '>' +
    '<span class="avatar-chip">' + avatarImg(n, a ? ('Avatar ' + a.label) : 'Votre avatar') + '</span>' + lvlHtml + '</span>';
}

function dayStats(d){
  const h = state.history.filter(x => (x.day == null ? 0 : x.day) === d);
  return { n:h.length, pts:h.reduce((a,b) => a + (parseInt(b.pts,10) || 0), 0), items:h };
}
/* Quatre paliers fixes : c'est une intensite, pas une mesure. Assez de pas pour
   voir la forme, pas assez pour creer un faux score precis. */
function heatLevel(n){ return n === 0 ? 0 : n === 1 ? 1 : n === 2 ? 2 : n <= 4 ? 3 : 4; }

function activityBlock(){
  const counts = [];
  for (let d = 6; d >= 0; d--) counts[d] = dayStats(d);
  const active = counts.filter(c => c.n > 0).length;
  const total = counts.reduce((a,c) => a + c.n, 0);
  const pts7 = counts.reduce((a,c) => a + c.pts, 0);

  const cells = counts.map((c,i) => {
    const d = 6 - i;
    return '<a class="heat-cell' + (d === 0 ? ' today' : '') + '" data-lv="' + heatLevel(c.n) + '"' +
      ' href="#/jour/' + d + '" data-od-id="activite-jour-' + d + '"' +
      ' aria-label="' + (d === 0 ? 'Aujourd’hui' : DAY_LB[(new Date().getDay() - d + 7) % 7]) + ' : ' + c.n + ' action' + (c.n > 1 ? 's' : '') + ', ' + c.pts + ' points"></a>';
  }).join('');

  const scale = '<div class="heat-scale" aria-hidden="true"><span>Moins</span>' +
    [0,1,2,3,4].map(l => '<i data-lv="' + l + '" style="' + (l ? 'background:rgba(104,239,63,' + [0,.24,.46,.72,1][l] + ')' : '') + '"></i>').join('') +
    '<span>Plus</span></div>';

  return '<div class="card" data-od-id="activite-semaine">' +
      '<div class="heat-days" aria-hidden="true">' + HEAT_LB.map(l => '<span>' + l + '</span>').join('') + '</div>' +
      '<div class="heat" role="img" aria-label="Contributions des 7 derniers jours : ' +
        counts.map((c,i) => (6 - i === 0 ? 'aujourd’hui' : DAY_LB[(new Date().getDay() - (6 - i) + 7) % 7]) + ' ' + c.n).join(', ') + '">' +
        cells + '</div>' + scale +
      '<div class="wk-foot"><b>' + active + ' jour' + (active > 1 ? 's' : '') + ' sur 7</b>' +
        '<span>' + total + ' actions · ' + pts7.toLocaleString('fr-FR') + ' pts</span></div>' +
      (total ? '<p class="help" style="margin:10px 0 0;text-align:center">Touchez un jour pour voir le détail.</p>' : '') +
    '</div>' +
    (total ? '' : '<div class="empty" data-od-id="activite-vide"><span class="ei">' + ic('leaf') + '</span>' +
        '<b>Aucune activité pour l’instant</b><p>Signalez votre premier déchet pour lancer votre progression.</p></div>');
}

let boardScope = 'quartier';
/* Le joueur courant entre dans le classement avec les mêmes champs que les autres. */
function meEntry(){
  return { name:state.user.name, pts:state.user.pts, tag:'Niveau ' + levelOf(state.user.pts) + ' · Rohero',
    avatar:avLook(), cat:state.user.cat || 'plastique', streak:state.user.streak || 1,
    acts:state.user.acts || 0, sig:state.user.sig || 0, me:true };
}
function boardList(){
  const data = BOARD_DATA[boardScope] || BOARD_DATA.quartier;
  const me = meEntry();
  /* Portee « amis » : uniquement les joueurs suivis, plus moi-meme pour savoir ou je suis. */
  if (boardScope === 'amis'){
    const f = state.user.follows || [];
    const mine = data.filter(p => f.indexOf(p.name) > -1);
    if (!mine.some(p => p.name === me.name)) mine.push(me);
    return mine.sort((a,b) => b.pts - a.pts);
  }
  return data.concat([me]).sort((a,b) => b.pts - a.pts);
}
/* Suivre / ne plus suivre : un seul état, persisté. */
function isFollowing(name){ return (state.user.follows || []).indexOf(name) > -1; }
function toggleFollow(name){
  const list = state.user.follows || (state.user.follows = []);
  const i = list.indexOf(name);
  if (i > -1) list.splice(i, 1); else list.push(name);
  save();
  return i === -1;
}
/* La place à tenir : l'écart en points avec le joueur juste au-dessus. */
function gapAbove(board, i){
  if (i <= 0) return null;
  return board[i - 1].pts - board[i].pts;
}

function screenClassement(){
  return header('Classement', SCOPE_SUB[boardScope],
      '<button class="iconbtn" id="boardInfo" aria-label="Comment fonctionne le classement">' + ic('info') + '</button>', 'classement-header') +
  '<div class="pad pad-b screen-in" data-od-id="classement-body">' +
      '<div class="od-cluster" style="--od-gap:8px" role="group" aria-label="Portée du classement">' +
      '<button class="chip" data-scope="quartier" aria-pressed="' + (boardScope==='quartier') + '">' + ic('map') + 'Quartier</button>' +
      '<button class="chip" data-scope="global" aria-pressed="' + (boardScope==='global') + '">' + ic('globe') + 'Global</button>' +
      '<button class="chip" data-scope="amis" aria-pressed="' + (boardScope==='amis') + '">' + ic('star') + 'Amis</button>' +
    '</div>' +
    '<div id="boardBody" style="margin-top:16px">' + renderBoard(boardScope) + '</div>' +
        /* Le classement se lit d un bout a l autre : les defis ne sont plus en tete d ecran,
           ils attendent en bas, avec le nombre de taches restantes. */
        '<a class="btn btn-secondary btn-block" data-od-id="classement-voir-defis" href="#/profil/defis" style="margin-top:22px">' +
          ic('bolt','sm') + 'Mes défis du jour' + '<span style="margin-left:auto;font-family:var(--font-mono);font-size:12px;color:var(--sprout)">' + defiCount() + '</span></a>' +
      '</div>';
    }
    /* Combien de taches restent a faire : le chiffre qui donne envie d y aller. */
    function defiCount(){
      const left = WEEK_TASKS.filter(t => t.get() < t.goal).length;
      return left === 0 ? 'Terminé' : left + ' restante' + (left > 1 ? 's' : '');
    }

/* Les defis vivent dans leur propre page (voir screenDefis) : le classement n en
   garde qu un lien en bas d ecran, l accueil et le profil un lien d entree. */
const WEEK_TASKS = [
  { icon:'bolt',   label:'Nettoyez 3 signalements', pts:150, goal:3, get:() => state.myCleanups.length },
  { icon:'camera', label:'Signalez 2 zones polluées',  pts:60,  goal:2, get:() => state.myReports.length },
  { icon:'leaf',   label:'Tenez une série de 3 jours', pts:100, goal:3, get:() => Math.min(state.user.streak || 0, 3) },
  { icon:'star',   label:'Suivez 2 éclaireurs', pts:40,  goal:2, get:() => (state.user.follows || []).length }
];
/* Portee « amis » vide : elle invite a revenir au quartier plutot que d afficher un tableau nu. */
function friendsEmpty(){
  return '<div class="empty" data-od-id="classement-aucun-ami"><span class="ei">' + ic('star') + '</span>' +
    '<b>Aucun ami suivi</b><p>Suivez des éclaireurs depuis le classement du quartier pour les retrouver ici.</p>' +
    '<button class="btn btn-secondary" id="goQuartier" type="button" style="margin-top:14px">' + ic('map','sm') + 'Voir le quartier</button></div>';
}

function renderBoard(scope){
  const board = boardList();
  const myIdx = board.findIndex(p => p.me);
  /* Portee « amis » sans aucun suivi : on ne montre pas un tableau vide sans explication. */
  if (scope === 'amis' && board.length <= 1) return friendsEmpty();
  const podium = [board[1], board[0], board[2]].filter(Boolean);
  return '<div class="bd-grp" style="margin-top:20px"><span class="g-ico">' + ic('trophy','xs') + '</span>' +
      '<h3>Podium</h3><span class="g-line"></span></div>' +
    '<div class="podium">' + podium.map((p,i) => podCard(p, [2,1,3][i])).join('') + '</div>' +
    myRankCard(board, myIdx) +
    '<div class="bd-grp" style="margin-top:26px"><span class="g-ico">' + ic('list','xs') + '</span>' +
      '<h3>Classement complet</h3><span class="g-n">' + board.length + '</span><span class="g-line"></span></div>' +
    '<div class="bd-list">' + board.map((p,i) => boardRow(p, i + 1)).join('') + '</div>' +
    '<p class="help" style="margin-top:20px;text-align:center">Touchez un joueur pour voir sa fiche et le suivre.</p>';
}

/* Le podium doit se lire en un coup d oeil : le 1er domine, le 3e s efface.
   Chaque marche porte son numero, donc aucune place n est devinee. */
function podCard(p, place){
  return '<button class="pod p' + place + (p.me ? ' me' : '') + '" type="button" data-player="' + esc(p.name) + '"' +

/* Ma ligne, isolee du reste : elle dit ou j en suis et combien me manque la place du dessus. */
function myRankCard(board, myIdx){
  const me = board[myIdx];
  if (!me) return '';
  const gap = gapAbove(board, myIdx);
  return '<div class="mycard" data-od-id="classement-ma-place">' +
    avatarChip(me.avatar, 'me', levelOf(me.pts)) +
    '<span class="who"><span class="w-l1"><b>Vous</b><span class="mc-rank">#' + (myIdx + 1) + ' sur ' + board.length + '</span></span>' +
      '<span class="w-l2"><span class="w-tag">Niveau ' + levelOf(me.pts) + ' · ' + (me.tag.split('·').pop() || '').trim() + '</span></span></span>' +
    '<span class="pts"><b>' + me.pts.toLocaleString('fr-FR') + '</b>' +
      '<em' + (gap !== null ? ' class="up"' : '') + '>' + (gap !== null ? '−' + gap + ' pts' : 'en tête') + '</em></span>' +
  '</div>';
}

/* Une ligne = un joueur. Une seule cible : la ligne ouvre la fiche, ou l on suit.
   Le petit « + » d avant est retire : il doublait la fiche et serrait la page. */
function boardRow(p, rank){
  const gap = gapAbove(boardList(), rank - 1);
  return '<div class="bd-row' + (p.me ? ' me' : '') + '" data-od-id="classement-joueur-' + slug(p.name) + '">' +
    '<button class="br-main" type="button" data-player="' + esc(p.name) + '"' + (p.me ? ' aria-current="true"' : '') +
      ' aria-label="Voir la fiche de ' + esc(p.name) + '">' +
      '<span class="rn' + (rank <= 3 ? ' top' : '') + '">' + rank + '</span>' +
      avatarChip(p.avatar, p.me ? 'me' : '', levelOf(p.pts)) +
      '<span class="who"><span class="w-l1"><b>' + (p.me ? 'Vous' : p.name) + '</b></span>' +
        '<span class="w-l2"><span class="w-tag">' + p.tag + '</span></span></span>' +
      '<span class="pts"><b>' + p.pts.toLocaleString('fr-FR') + '</b>' +
        '<em' + (gap !== null ? ' class="up"' : '') + '>' + (gap !== null ? '−' + gap : 'en tête') + '</em></span>' +
    '</button>' +
  '</div>';
}

    ic(isFollowing(name) ? 'check' : 'plus','sm') + (isFollowing(name) ? 'Abonné' : 'Suivre ' + name.split(' ')[0]) + '</button>');

/* ── Bilan d'impact ───────────────────────────────────────────────
   L'ecran montre ce que le profil a produit, et le bouton transforme
   cette meme carte en image partageable. Les deux sont dessinees a
   partir de bilanData() : aucun chiffre n existe a un seul endroit. */
function bilanData(){
  const pts = state.user.pts, lvl = levelOf(pts);
  const floor = (lvl - 1) * LEVEL_STEP;
  const sig = state.myReports.length, cln = state.myCleanups.length;
  const badges = badgeList().filter(b => b.on).length;
  const hist = state.history.slice().reverse();
  const sigs = hist.filter(h => h.kind !== 'cleaned').length;
  const clns = hist.filter(h => h.kind === 'cleaned').length;
  /* Chaque nettoyage debarrasse une zone entiere : on compte les zones
     confirmees. Aucun poids en kilos n'est affiche : ce serait une
     estimation presentee comme une mesure. */
  const zones = state.myCleanups.length;
  const serie = state.user.streak || 0;
  return {
    name: state.user.name, pts, lvl,
    next: floor + LEVEL_STEP - pts,
    rank: myRank(),
    sig, cln, zones, sigs, clns, badges, serie,
    look: avLook(),
    /* Repartition par type, sur les nettoyages confirmes de l'historique.
       Deux entrees suffisent pour une repartition honnete. */
    part: (() => {
      const m = {};
      hist.filter(h => h.kind === 'cleaned').forEach(h => {
        const m2 = h.text.match(/·\s*([^,·]+),/);
        if (m2) { const k = m2[1].trim(); m[k] = (m[k] || 0) + 1; }
      });
      const arr = Object.keys(m).map(k => ({ label:k, n:m[k] })).sort((a,b) => b.n - a.n).slice(0, 4);
      const max = arr.length ? arr[0].n : 1;
      return arr.map(a => ({ ...a, pct: Math.round(a.n / max * 100) }));
    })()
  };
}

/* ── Export : la carte en image ───────────────────────────────────
   Le poster est redessine au pixel pres sur un canvas 1080x1350, avec
   les memes valeurs que l'ecran. Une seule source de verite, donc pas
   de carte qui diverge de ce qui est partage. */
function bilanPoster(){
  const d = bilanData();
  const W = 1080, H = 1350;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');

  const bg = g.createLinearGradient(0, 0, W * .6, H);
  bg.addColorStop(0, '#1d3524'); bg.addColorStop(.55, '#122314'); bg.addColorStop(1, '#0a1509');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  const glow = g.createRadialGradient(W - 60, 40, 0, W - 60, 40, 620);
  glow.addColorStop(0, 'rgba(104,239,63,.28)'); glow.addColorStop(1, 'rgba(104,239,63,0)');
  g.fillStyle = glow; g.fillRect(0, 0, W, 620);

  const UI = "500 26px Geist, system-ui, sans-serif";
  const UIb = "600 26px Geist, system-ui, sans-serif";
  const DISP = "400 74px Boldonse, system-ui, sans-serif";
  const MONO = "600 26px Geist, system-ui, sans-serif";
  const centered = (txt, y, font, color) => {
    g.font = font; g.fillStyle = color; g.textAlign = 'center';
    g.fillText(txt, W / 2, y);
    g.textAlign = 'left';
  };

  return new Promise(resolve => {
    const av = d.look && d.look.photo
      ? new Image()
      : new Image();
    av.onload = () => { draw(); resolve(c); };
    av.onerror = () => { draw(); resolve(c); };
    if (d.look && d.look.photo) {
      av.src = d.look.photo;
    } else {
      const raw = avatarSVG(d.look, d.name)
        .replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" ');
      av.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(raw);
    }

    function draw(){
      /* avatar : disque de 220, ceint d'un vert diffus */
      const R = 110, cx = W / 2, cy = 262;
      const halo = g.createRadialGradient(cx, cy, R * .6, cx, cy, R * 1.35);
      halo.addColorStop(0, 'rgba(104,239,63,.20)'); halo.addColorStop(1, 'rgba(104,239,63,0)');
      g.fillStyle = halo;
      g.beginPath(); g.arc(cx, cy, R * 1.35, 0, Math.PI * 2); g.fill();
      g.save();
      g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.closePath(); g.clip();
      try { g.drawImage(av, cx - R, cy - R, R * 2, R * 2); } catch(e){}
      g.restore();
      g.lineWidth = 4; g.strokeStyle = 'rgba(104,239,63,.55)';
      g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.stroke();

      centered(d.name, 452, DISP, '#ffffff');
      centered('Niveau ' + d.lvl + ' · #' + d.rank + ' du quartier', 496, UI, '#68ef3f');
      centered(d.pts.toLocaleString('fr-FR'), 610, DISP, '#68ef3f');
      centered('POINTS', 646, MONO, '#b7bda5');

      /* trois chiffres cles, en rangee */
      const cells = [
        [String(d.sigs), 'signalements publiés'],
        [String(d.clns), 'nettoyages validés'],
        [String(d.badges), 'badges obtenus']
      ];
      const cw = (W - 160) / 3, x0 = 80, y0 = 700, ch = 150;
      g.fillStyle = 'rgba(255,255,255,.07)'; g.fillRect(x0, y0, W - 160, ch);
      cells.forEach((c2, i) => {
        const cx2 = x0 + cw * i + cw / 2;
        g.save();
        g.textAlign = 'center';
        g.font = "400 44px Boldonse, system-ui, sans-serif"; g.fillStyle = '#ffffff';
        g.fillText(c2[0], cx2, y0 + 66);
        g.font = UI; g.fillStyle = '#a7ac9a';
        const words = c2[1].split(' ');
        const mid = Math.ceil(words.length / 2);
        g.fillText(words.slice(0, mid).join(' '), cx2, y0 + 102);
        g.fillText(words.slice(mid).join(' '), cx2, y0 + 130);
        g.restore();
      });
      /* séparateurs verticaux */
      g.fillStyle = 'rgba(255,255,255,.09)';
      for (let i = 1; i < 3; i++) g.fillRect(x0 + cw * i, y0, 1, ch);

      /* série + badges, en pastilles */
      const pills = [
        d.serie + ' jours de série',
        d.zones + (d.zones > 1 ? ' zones nettoyées' : ' zone nettoyée'),
        'Rohero · Bujumbura'
      ];
      g.font = UIb;
      const widths = pills.map(t => g.measureText(t).width + 56);
      let px = (W - (widths.reduce((a,b) => a + b, 0) + 24 * (pills.length - 1))) / 2;
      pills.forEach((t, i) => {
        const w = widths[i];
        const py = 906;
        g.beginPath();
        if (g.roundRect) { g.roundRect(px, py, w, 62, 31); } else { g.rect(px, py, w, 62); }
        g.fillStyle = 'rgba(104,239,63,.14)'; g.fill();
        g.strokeStyle = 'rgba(104,239,63,.3)'; g.lineWidth = 2; g.stroke();
        g.fillStyle = '#b7bda5'; g.font = UIb; g.textAlign = 'left';
        g.fillText(t, px + 28, py + 40);
        px += w + 24;
      });

      /* repartition par type : des barres pleines, pas des contours */
      if (d.part.length){
        g.font = UIb; g.fillStyle = '#b7bda5'; g.textAlign = 'left';
        g.fillText('CE QUE VOUS NETTOYEZ', 80, 1058);
        const max = d.part[0].n;
        d.part.forEach((p, i) => {
          const y = 1112 + i * 52;
          g.font = UI; g.fillStyle = '#b7bda5';
          g.fillText(p.label, 80, y + 20);
          const tw = 700, tx = 380;
          g.fillStyle = 'rgba(255,255,255,.09)';
          g.beginPath();
          if (g.roundRect) { g.roundRect(tx, y, tw, 22, 11); } else { g.rect(tx, y, tw, 22); }
          g.fill();
          const w = Math.max(22, tw * (p.n / max));
          g.fillStyle = '#68ef3f';
          g.beginPath();
          if (g.roundRect) { g.roundRect(tx, y, w, 22, 11); } else { g.rect(tx, y, w, 22); }
          g.fill();
          g.font = MONO; g.fillStyle = '#ffffff'; g.textAlign = 'right';
          g.fillText(String(p.n), W - 80, y + 20);
          g.textAlign = 'left';
        });
      }

      /* signature : la marque en bas, filet vert */
      const line = g.createLinearGradient(80, 0, W - 80, 0);
      line.addColorStop(0, 'rgba(104,239,63,0)'); line.addColorStop(.5, 'rgba(104,239,63,.4)'); line.addColorStop(1, 'rgba(104,239,63,0)');
      g.fillStyle = line; g.fillRect(80, H - 96, W - 160, 2);
      g.beginPath();
      if (g.roundRect) { g.roundRect(W / 2 - 62, H - 150, 44, 44, 13); } else { g.rect(W / 2 - 62, H - 150, 44, 44); }
      g.fillStyle = '#68ef3f'; g.fill();
      g.fillStyle = '#122314'; g.font = "600 24px Geist, system-ui, sans-serif"; g.textAlign = 'center';
      g.fillText('G', W / 2 - 40, H - 118);
      g.fillStyle = '#b7bda5'; g.font = UI;
      g.fillText('Greenshot · Bujumbura', W / 2 + 6, H - 120);
    }
  });
}

function initBilan(){
  const share = document.getElementById('bilanShare');
  const save = document.getElementById('bilanSave');
  const note = document.getElementById('bilanNote');
  if (!share && !save) return;

  const busy = msg => {
    note.innerHTML = '<span class="imp-busy"><span class="imp-spin" aria-hidden="true"></span>' + msg + '</span>';
  };
  const done = msg => { note.innerHTML = msg; };

  /* L image est decoupee a la volee : Web Share peut la transporter si
     l appareil l'accepte, sinon on retombe sur le telechargement. */
  const build = () => bilanPoster().then(c => new Promise(res => c.toBlob(res, 'image/png')));

  if (share) share.addEventListener('click', async () => {
    share.disabled = true;
    busy('Préparation de la carte…');
    try {
      const blob = await build();
      const file = new File([blob], 'greenshot-bilan-' + slug(state.user.name) + '.png', { type:'image/png' });
      const text = 'Mon bilan Greenshot : ' + state.user.pts.toLocaleString('fr-FR') + ' points, '
        + bilanData().sig + ' signalements, ' + bilanData().cln + ' nettoyages validés.';
      if (navigator.canShare && navigator.canShare({ files:[file] }) && navigator.share){
        await navigator.share({ title:'Mon bilan Greenshot', text, files:[file] });
        done('Carte partagée.');
      } else if (navigator.share){
        await navigator.share({ title:'Mon bilan Greenshot', text });
        done('Résumé partagé — l’image n’est pas passée sur cet appareil.');
      } else {
        await navigator.clipboard.writeText(text + ' Téléchargez la carte avec le bouton ci-dessous.');
        done('Résumé copié. L’image reste à télécharger.');
      }
    } catch(e){
      done('Partage indisponible sur cet appareil — utilisez le téléchargement.');
    }
    share.disabled = false;
  });

  if (save) save.addEventListener('click', async () => {
    save.disabled = true;
    busy('Génération de l’image…');
    try {
      const blob = await build();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'greenshot-bilan-' + slug(state.user.name) + '.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      done('Image enregistrée dans vos téléchargements.');
    } catch(e){
      done('Export impossible sur cet appareil.');
    }
    save.disabled = false;
  });
}

function historyBlock(limit){

  const dayName = d => d === 0 ? 'Aujourd’hui' : d === 1 ? 'Hier' : DAY_LB[(new Date().getDay() - d + 7) % 7];

      '<span class="hist-ic ' + (h.kind === 'cleaned' ? 'cleaned' : '') + '">' + ic(h.icon || 'spark','sm') + '</span>' +

      }
      function settingRow(iconName, label, key){

function route(){
  const raw = location.hash.replace(/^#\/?/, '');
  const parts = raw.split('/');
  return { name: parts[0] || 'accueil', param: parts[1] || '' };
}

let cleanup = { id:null, phase:0, before:null, after:null, note:'', done:false };

function render(){
  const { name, param } = route();
  stopNearby();
  const main = document.getElementById('main');
  const fn = screens[name] || screens.accueil;
  main.classList.toggle('is-locked', name === 'carte');
  main.innerHTML = fn(param);
  main.scrollTop = 0;
  /* La page d un jour appartient a l accueil : c est un detail de l activite. */
  const navActive = (name === 'signalement' || name === 'carte' || name === 'nettoyage') ? 'carte'
    : (name === 'jour') ? 'accueil' : name;
  renderNav(NAV.some(n => n.id === name) ? name : navActive);
  /* Le bouton flottant n existe que sur l'accueil : ailleurs il couvrirait le
     contenu d'un ecran deja dense. Son badge compte les signalements rouges,
     les seuls qui demandent une organisation et non un nettoyage. */
  const fab = document.getElementById('fabAssistant');
  const reds = state.reports.filter(isRed).length;
  fab.style.display = name === 'accueil' ? '' : 'none';
  document.getElementById('fabBadge').textContent = reds ? String(reds) : '';
  fab.setAttribute('aria-label', reds
    ? 'Ouvrir l’assistant Green — ' + reds + ' alerte' + (reds > 1 ? 's' : '')
    : 'Ouvrir l’assistant Green');
  afterRender(name, param);
  closeSheet();
}

function afterRender(name, param){
  document.querySelectorAll('[data-back]').forEach(b => b.addEventListener('click', () => history.length > 1 ? history.back() : location.hash = '#/accueil'));
  document.querySelectorAll('[data-goto]').forEach(b => b.addEventListener('click', () => location.hash = b.getAttribute('data-goto')));
  /* Le bouton de serie est un <button>, pas un lien : il porte le meme data-goto
     et doit donc etre branche a part. */
  document.querySelectorAll('button[data-goto]').forEach(b => b.addEventListener('click', () => location.hash = b.getAttribute('data-goto')));
  /* Le hub : les deux portes du meme ecran, donc un seul.delegue, branche une
     fois pour toutes, quel que soit le mode dans lequel on se trouve. */
  document.querySelectorAll('[data-hub]').forEach(b => b.addEventListener('click', () => {
    const want = b.getAttribute('data-hub');
    if (signalerMode === want) return;
    signalerMode = want;
    render();
  }));
  document.querySelectorAll('[data-clean]').forEach(b => b.addEventListener('click', () => {
    location.hash = '#/nettoyage/' + b.getAttribute('data-clean');
  }));
  document.querySelectorAll('[data-share-report]').forEach(b => b.addEventListener('click', async () => {
    const r = reportById(param);
    const txt = '⚠️ Signalement Greenshot — ' + r.address + ' (' + r.area + '). Transmis à ' + r.org + '.';
    try {
      if (navigator.share) { await navigator.share({ title:'Alerte Greenshot', text: txt }); return; }
      await navigator.clipboard.writeText(txt);
      toast('Alerte copiée · à partager autour de vous');
    } catch(e){ toast('Partage indisponible sur cet appareil'); }
  }));
  if (name === 'accueil') initNearby();
  if (name === 'signaler') initSignaler();
  if (name === 'nettoyage') initNettoyage(param);
  if (name === 'profil') initProfil();
  if (name === 'profil' && param === 'reglages') initReglages();
  if (name === 'profil' && param === 'defis') bindTasks();
  if (name === 'profil' && param === 'bilan') initBilan();
  const rp = document.getElementById('replayEntry');
  if (rp) rp.addEventListener('click', () => enStart());
  if (name === 'classement') initClassement();
}

let nearbyTimer = null, nearbySince = Date.now();
let incoming = INCOMING.map(r => ({ ...r }));
function stopNearby(){ if (nearbyTimer) { clearInterval(nearbyTimer); nearbyTimer = null; } }
function nearbyItems(){ return state.reports.filter(r => r.status !== 'done'); }
function renderNearby(){
  const wrap = document.getElementById('nearbyList');
  if (!wrap) return;
  const items = nearbyItems().slice(0, 4);
  wrap.innerHTML = items.length ? items.map(r => reportRow(r, { showPts:true })).join('')
    : '<div class="empty"><span class="ei">' + ic('check') + '</span><b>Rien à nettoyer</b><p>Votre quartier est propre. Revenez plus tard !</p></div>';
  wrap.querySelectorAll('[data-goto]').forEach(b => b.addEventListener('click', () => location.hash = b.getAttribute('data-goto')));
}
function stampNearby(){
  const el = document.getElementById('nearbyStamp');
  if (!el) return;
  const s = Math.max(0, Math.round((Date.now() - nearbySince) / 1000));
  el.textContent = 'Actualisé il y a ' + s + ' s';
}
function ingestNearby(){
  if (!incoming.length) return false;
  const r = incoming.shift();
  r.id = 'n' + Date.now();
  r.mine = false;
  state.reports.unshift(r);
  save();
  return true;
}
function initNearby(){
  renderNearby();
  nearbySince = Date.now();
  stampNearby();
  const btn = document.getElementById('nearbyRefresh');
  if (btn) btn.addEventListener('click', () => {
    const added = ingestNearby();
    nearbySince = Date.now();
    renderNearby(); stampNearby();
    toast(added ? 'Nouveaux signalements détectés' : 'Liste actualisée');
  });
  stopNearby();
  nearbyTimer = setInterval(() => {
    if ((Date.now() - nearbySince) >= 30000) {
      const added = ingestNearby();
      nearbySince = Date.now();
      renderNearby();
      if (added) toast('Nouveau signalement près de vous');
    }
    stampNearby();
  }, 1000);
}

photoInput.style.cssText = 'position:absolute;width:1px;height:1px;opacity:0;pointer-events:none';
document.body.appendChild(photoInput);
photoInput.addEventListener('change', () => {
  const file = photoInput.files && photoInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = c.height = 360;
      const g = c.getContext('2d');
      const side = Math.min(img.width, img.height);
      g.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, 360, 360);
      state.user.look = Object.assign(avLook(), { photo:c.toDataURL('image/jpeg', .86) });
      save(); render(); toast('Photo de profil mise à jour');
    };
    img.onerror = () => toast('Image illisible — essayez une autre photo');
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
  photoInput.value = '';
});

    if (c) c.click();
  });

    el.addEventListener('click', () => openPlayer(el.getAttribute('data-player'))));

/* Les branches sur une tache de defi : elle ouvre sa fiche et le bouton qui mene
   a l action qui l accomplit. Utilise par la page Defis du jour. */
function bindTasks(){
  document.querySelectorAll('[data-task]').forEach(btn => btn.addEventListener('click', () => {
    const t = WEEK_TASKS[+btn.getAttribute('data-task')];
    if (!t) return;
    const left = Math.max(0, t.goal - Math.min(t.get(), t.goal));
    openSheet('<h3>' + t.label + '</h3>' +
      '<div class="card wash"><div class="od-row"><span class="tico" style="width:40px;height:40px;background:rgba(48,50,42,.12);color:var(--onyx);border-color:transparent">' + ic(left ? t.icon : 'check') + '</span>' +

function initSignaler(){
  let photo = null, cat = null;
  const cap = document.getElementById('capture');
  /* En mode « nettoyer » le formulaire n'existe pas : rien a brancher ici. */
  if (!cap) return;
  const setPhoto = (url, demo) => {
    photo = url;
    cap.innerHTML = '<img src="' + url + '" alt="Photo du déchet sélectionnée" />' +
      '<button class="iconbtn rephot" id="retake" aria-label="Reprendre la photo">' + ic('refresh','sm') + '</button>' +
      (demo ? '<span class="tagdemo">Photo de démonstration</span>' : '');
    const rt = document.getElementById('retake');
    if (rt) rt.addEventListener('click', e => { e.stopPropagation(); openCamera(); });
  };
  const openCamera = () => {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = 'image/*'; input.capture = 'environment';
    input.onchange = e => { const f = e.target.files && e.target.files[0]; if (!f) return; const u = URL.createObjectURL(f); setPhoto(u, false); };
    input.click();
  };
  const tap = () => { if (!photo) openCamera(); };
  cap.addEventListener('click', tap);
  cap.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tap(); } });
  document.getElementById('demoPhoto').addEventListener('click', e => { e.stopPropagation(); setPhoto(demoImage(), true); });
  document.querySelectorAll('[data-cat]').forEach(b => b.addEventListener('click', () => {
    cat = b.getAttribute('data-cat');
    document.querySelectorAll('[data-cat]').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
    document.getElementById('cathelp').innerHTML = 'Catégorie choisie : <b style="color:' + TYPES[cat].color + '">' + TYPES[cat].label + '</b> · +' + TYPES[cat].points + ' pts.';
    hideError();
  }));
  const hideError = () => { const el = document.getElementById('formError'); if (el) el.style.display = 'none'; };
  const showError = (msg) => { const el = document.getElementById('formError'); if (el) { el.textContent = msg; el.style.display = ''; } };
  document.getElementById('submitReport').addEventListener('click', () => {
    const street = document.getElementById('street').value;
    const note = document.getElementById('note').value.trim();
    const errs = [];
    if (!photo) errs.push('Ajoutez une photo du déchet.');
    if (!cat) errs.push('Choisissez un type de déchet.');
    if (errs.length) { showError(errs.join(' ')); return; }
    publishReport(cat, street, note || 'Signalement créé depuis l’application.');
  });
}
/* La publication est une operation unique, partagee par le formulaire et par
   l assistant : memes points, meme historique, meme celebration. Une seule
   fonction, donc pas deux verites sur la meme action. */
function publishReport(cat, street, note, then){
  const t = TYPES[cat];
  if (!t) return false;
  const id = 'u' + Date.now();
  const pos = pinPosFor(street);
  const clean = street.replace(/\s*\(.*\)$/, '');
  state.reports.unshift({ id, type:cat, address:clean, area:(street.match(/\(([^)]+)\)/) || ['','Bujumbura'])[1],
    lon:pos.lon, lat:pos.lat, status:'open', reporter:'Vous', when:'à l’instant', note:note || 'Signalement créé depuis l’application.', mine:true });
  state.myReports.push(id);
  addPoints(t.points, 'Signalement publié · ' + clean, 'camera', 'published');
  save();
  celebrate('+' + t.points, 'Signalement publié !', 'Merci, votre signalement est maintenant visible sur la carte.', 'camera');
  if (typeof then === 'function') then(t, id);
  else setTimeout(() => { location.hash = '#/carte'; }, 2200);
  return true;
}
/*Emplacement de départ (lon/lat) associé à chaque lieu proposé, avec une légère dispersion */
const PLACE_GEO = [
  { key:'Marché du Centre', lon:29.3626, lat:-3.3826 },
  { key:'Avenue du Commerce', lon:29.3651, lat:-3.3801 },
  { key:'Carrefour Sipromoke', lon:29.3611, lat:-3.3965 },
  { key:'Avenue de l’Indépendance', lon:29.3662, lat:-3.3642 },
  { key:'Quai de la Ruvubu', lon:29.3581, lat:-3.3898 },
  { key:'Route de Gatumba', lon:29.3122, lat:-3.4415 },
  { key:'Marché de Cibitoke', lon:29.3638, lat:-3.4049 },
  { key:'Gitega', lon:29.9268, lat:-3.4252 }
];
function pinPosFor(street){
  const hit = PLACE_GEO.find(p => street.indexOf(p.key) === 0) || PLACE_GEO[0];
  return { lon: hit.lon + (Math.random()*0.02 - 0.01), lat: hit.lat + (Math.random()*0.02 - 0.01) };
}
function demoImage(){
  const c = document.createElement('canvas'); c.width = 640; c.height = 480;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0,0,640,480);
  grd.addColorStop(0,'#1f3520'); grd.addColorStop(1,'#0a1509');
  g.fillStyle = grd; g.fillRect(0,0,640,480);
  g.strokeStyle = 'rgba(183,189,165,.35)'; g.lineWidth = 2;
  for (let i=0;i<26;i++){ g.beginPath(); g.moveTo(Math.random()*640, Math.random()*480); g.lineTo(Math.random()*640, Math.random()*480); g.stroke(); }
  g.fillStyle = 'rgba(104,239,63,.9)'; g.font = '600 22px system-ui,sans-serif';
  g.fillText('Photo de démonstration', 34, 448);
  g.font = '400 15px system-ui,sans-serif'; g.fillStyle = 'rgba(183,189,165,.9)';
  g.fillText('Aucune photo réelle sélectionnée', 34, 472);
  return c.toDataURL('image/png');
}

function runAnalysis(reward){
  const steps = [
    { t:'Chargement des deux images', d:520 },
    { t:'Détection des déchets (avant)', d:760 },
    { t:'Détection de la zone nettoyée (après)', d:760 },
    { t:'Vérification que l’endroit n’a pas changé', d:880 },
    { t:'Comparaison avant / après', d:820 },
    { t:'Calcul du score de confiance', d:560 }
  ];
  const lines = document.getElementById('aiLines');
  const fill = document.getElementById('confFill');
  let i = 0;
  const next = () => {
    if (!document.body.contains(lines)) return;
    if (i >= steps.length) { finishAnalysis(reward); return; }
    const s = steps[i];
    lines.querySelectorAll('.ailine.active').forEach(el => { el.classList.add('done'); el.querySelector('.rd').innerHTML = ic('check','xs'); el.classList.remove('active'); });
    const el = document.createElement('div');
    el.className = 'ailine active';
    el.innerHTML = '<span class="rd"><span class="spin"></span></span><span class="od-fill">' + s.t + '</span>';
    lines.appendChild(el);
    if (fill) fill.style.width = Math.round((i + 1) / (steps.length + 1) * 100) + '%';
    i++;
    setTimeout(next, s.d);
  };
  next();
}
function finishAnalysis(reward){
  const r = reportById(cleanup.id);
  r.status = 'done';
  const conf = 91 + Math.floor(Math.random() * 8);
  /* Le controle du lieu : la demonstration simule une reconnaissance dnapshot.
     En production ce score vient de la comparaison des deux images cote modele. */
  const siteOk = conf >= 93;
  cleanup.done = true;
  if (!state.myCleanups.includes(r.id)) state.myCleanups.push(r.id);
  addPoints(reward, 'Nettoyage validé', 'leaf');

function addPoints(n, text, iconName, kind){
  state.user.pts += n;
  state.history.push({ text, pts:'+' + n, when:'à l’instant', icon:iconName || 'spark', kind:kind || 'published', day:0 });
  if (state.history.length > 40) state.history = state.history.slice(-40);
}

const scrim = document.getElementById('scrim');
const sheetEl = document.getElementById('sheet');
function openSheet(html){
  sheetEl.innerHTML = '<div class="grip"></div>' + html + '<button class="btn btn-secondary btn-block" data-close style="margin-top:14px">Fermer</button>';
  scrim.classList.add('on'); sheetEl.classList.add('on');
  sheetEl.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeSheet));
  sheetEl.querySelectorAll('a[href^="#/"]').forEach(a => a.addEventListener('click', () => closeSheet()));
}
function closeSheet(){ scrim.classList.remove('on'); sheetEl.classList.remove('on'); }
scrim.addEventListener('click', closeSheet);
window.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

const toastEl = document.getElementById('toast');
let toastTimer = null;
function toast(msg){
  toastEl.innerHTML = '<span class="ti">' + ic('check','xs') + '</span><span class="od-fill">' + msg + '</span>';
  toastEl.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('on'), 2600);
}

/* ═══ Assistant Green ════════════════════════════════════════════════════
   Il ne devine pas : il lit `state`, donc ses réponses sont celles de l'app.
   Il ne fait rien sans confirmation : chaque action qu'il propose est validée
   par un bouton, et il termine toujours par une question pour reprendre la
   main. Les entrées sont des choix cliquables, avec un champ libre en secours
   — jamais une boîte de dialogue vide à remplir. */
const asEl = document.getElementById('assistant');
const asLog = document.getElementById('asLog');
const asOpts = document.getElementById('asOpts');
const asInput = document.getElementById('asInput');
/* Le brouillon du signalement en cours : ce que Green a proposé, en attente de
   validation. Il vit hors de `state` : rien n'est écrit avant le clic. */
let asDraft = null;

const asSrc = src => '<span class="msg-src">' + ic('info','xs') + esc(src) + '</span>';
function asSay(html, src){
  const d = document.createElement('div');
  d.className = 'msg bot';
  d.innerHTML = html + (src ? asSrc(src) : '');
  asLog.appendChild(d);
  asScroll();
}
function asMe(text){
  const d = document.createElement('div');
  d.className = 'msg me';
  d.textContent = text;
  asLog.appendChild(d);
  asScroll();
}
function asCard(title, sub, lines, src){
  const d = document.createElement('div');
  d.className = 'msg msg-card';
  d.innerHTML = '<h4>' + title + '</h4>' + (sub ? '<p class="mc-sub">' + sub + '</p>' : '') +
    lines.map(l => '<div class="mc-line"><span class="tico" style="width:32px;height:32px">' + ic(l[0],'sm') + '</span>' +
      '<span class="od-fill"><b>' + l[1] + '</b><span>' + l[2] + '</span></span>' +
      (l[3] ? '<span class="gain">' + l[3] + '</span>' : '') + '</div>').join('') +
    (src ? asSrc(src) : '');
  asLog.appendChild(d);
  asScroll();
}
/* Les propositions. `go` = action principale, une seule par serie.
   Elles ne portent pas d'écouteur propre : un seul délégué global sur
   [data-as] résout tout, donc un clic ne peut pas se déclencher deux fois. */
function asChoices(list){
  asOpts.innerHTML = list.map(o =>
    '<button class="as-opt' + (o.go ? ' go' : '') + '" type="button" data-as="' + o.id + '">' +
    (o.icon ? ic(o.icon,'sm') : '') + esc(o.label) + '</button>').join('');
}
function asScroll(){ asLog.scrollTop = asLog.scrollHeight; }
function asClear(){
  asLog.innerHTML = '';
  asOpts.innerHTML = '';
  asDraft = null;
}

/* Les tâches de Green : ce qu'il sait faire, en clair. */
const AS_MENU = [
  { id:'signaler', label:'J’ai vu un déchet', icon:'camera' },
  { id:'nettoyer', label:'Je veux nettoyer', icon:'leaf' },
  { id:'defis',    label:'Mes défis du jour',  icon:'bolt' },
  { id:'points',   label:'Mes points',        icon:'reward' },
  { id:'alertes',  label:'Alertes en cours',  icon:'shield' }
];
function asHello(){
  asClear();
  const u = state.user, lvl = levelOf(u.pts);
  asSay('Bonjour <b>' + esc(u.name) + '</b>. Je suis Green, l’assistant de Greenshot.' +
    '<span class="ml">Je lis votre profil, vos défis et les signalements autour de vous. Dites-moi ce que vous voulez faire — je m’occupe de la paperasse.</span>');
  asCard('Où vous en êtes', 'Lu dans votre profil, en direct',
    [['trophy','Niveau ' + lvl, (u.streak || 0) + ' jours d’affilée', u.pts.toLocaleString('fr-FR') + ' pts'],
     ['camera', state.myReports.length + ' signalements', state.myCleanups.length + ' nettoyages validés', ''],
     ['bolt', defiCount(), WEEK_TASKS.filter(t => t.get() >= t.goal).length + ' tâches sur ' + WEEK_TASKS.length + ' accomplies', '']],
    'Source : votre profil');
  asChoices(AS_MENU.map(o => ({ id:o.id, label:o.label, icon:o.icon })));
}
/* Branchement des intentions. Une fonction par intention, lisible d'un coup
   d'œil : ajouter une question à Green = ajouter une entrée ici. */
const AS_ACTIONS = {
  signaler(){ asFlowSignaler(); },
  nettoyer(){ asFlowNettoyer(); },
  defis(){ asDefis(); },
  points(){ asPoints(); },
  alertes(){ asAlertes(); },
  aide(){ asMenu(); },
  menu(){ asMenu(); }
};
/* Le menu, de nouveau disponible : c'est le filet de securite, celui qui evite
   de se perdre. Presente partout, jamais cache. */
function asMenu(){
  asSay('Que voulez-vous faire ?', 'Choisissez une proposition ci-dessous');
  asChoices(AS_MENU.map(o => ({ id:o.id, label:o.label, icon:o.icon })));
}

function asDefis(){
  const left = WEEK_TASKS.filter(t => t.get() < t.goal);
  asSay(left.length
    ? 'Il vous reste <b>' + left.length + '</b> tâche' + (left.length > 1 ? 's' : '') + ' à terminer. Chacune rapporte ses points dès qu’elle est validée.'
    : 'Tout est accompli aujourd’hui. Le compteur repart lundi à minuit.', 'Source : mes défis du jour');
  asCard('Défis du jour', WEEK_TASKS.filter(t => t.get() >= t.goal).length + ' sur ' + WEEK_TASKS.length + ' terminés',
    WEEK_TASKS.map(t => [t.get() >= t.goal ? 'check' : t.icon, t.label,
      Math.min(t.get(), t.goal) + ' / ' + t.goal, '+' + t.pts + ' pts']));
  asChoices(left.length
    ? [{ id:'signaler', label:'Attaquer une tâche', icon:'camera', go:true }, { id:'menu', label:'Autre chose', icon:'list' }]
    : [{ id:'points', label:'Voir mon score', icon:'reward', go:true }, { id:'menu', label:'Autre chose', icon:'list' }]);
}

function asPoints(){
  const u = state.user, lvl = levelOf(u.pts);
  const floor = (lvl - 1) * LEVEL_STEP, left = floor + LEVEL_STEP - u.pts;
  const list = BOARD_DATA[boardScope] || BOARD_DATA.quartier;
  const rank = 1 + list.filter(x => x.pts > u.pts).length;
  asSay('Vous avez <b>' + u.pts.toLocaleString('fr-FR') + ' points</b>, au niveau <b>' + lvl + '</b>. Encore ' + left + ' points pour le niveau ' + (lvl + 1) + '.', 'Source : votre profil et le classement');
  asCard('Votre score', SCOPE_SUB[boardScope],
    [['reward','Total cumulé', lvl + 'e niveau · série de ' + (u.streak || 0) + ' jours', ''],
     ['trophy','Place actuelle', 'classement ' + boardScope, rank + (rank > 1 ? 'e' : 'er')],
     ['leaf','Vos actions', state.myCleanups.length + ' nettoyages · ' + state.myReports.length + ' signalements', '']]);
  asChoices([
    { id:'defis', label:'Gagner plus de points', icon:'bolt', go:true },
    { id:'menu', label:'Autre chose', icon:'list' }
  ]);
}

/* Les signalements rouges : ils ne sont pas nettoyables par un particulier.
   Green les explique plutot que de les cacher — c'est la seule reponse honnete. */
function asAlertes(){
  const reds = state.reports.filter(isRed);
  if (!reds.length){
    asSay('Aucune alerte en cours. Tout ce qui est signalé autour de vous peut être nettoyé par un éclaireur.', 'Source : les signalements du Burundi');
    asChoices([{ id:'menu', label:'Autre chose', icon:'list', go:true }]);
    return;
  }
  asSay('<b>' + reds.length + ' signalement' + (reds.length > 1 ? 's' : '') + '</b> engage votre sécurité : ils demandent l’intervention d’une organisation, pas un nettoyage entre voisins. Je peux vous dire de qui il s’agit.',
    'Source : les signalements du Burundi');
  asCard('Alertes transmises', 'Green ne propose pas de les nettoyer',
    reds.map(r => ['shield', r.address, r.org, 'En attente']));
  asChoices([
    { id:'menu', label:'Autre chose', icon:'list' },
    { id:'goalerte', label:'Voir sur la carte', icon:'map', go:true }
  ]);
}

/* Nettoyer : Green lit la liste des zones ouvertes et propose les plus
   proches. Il ne lesTrie pas au hasard, il affiche ce que l'app propose. */
function asFlowNettoyer(){
  const list = openReports();
  if (!list.length){
    asSay('Plus rien à nettoyer dans votre quartier : tous les signalements ouverts ont déjà été validés. Revenez après le prochain passage.', 'Source : les signalements ouverts');
    asChoices([{ id:'menu', label:'Autre chose', icon:'list', go:true }]);
    return;
  }
  /* Deux signalements peuvent viser la meme adresse (types differents). On
     n en propose qu un : une liste ou le meme lieu apparait deux fois oblige
     l utilisateur a deviner lequel est le bon. */
  const seen = new Set();
  const top = list.filter(r => {
    if (seen.has(r.address)) return false;
    seen.add(r.address);
    return true;
  }).slice(0, 3);
  asSay('Il y a <b>' + list.length + '</b> zone' + (list.length > 1 ? 's' : '') + ' signalée' + (list.length > 1 ? 's' : '') + ' à nettoyer. Voici les premières. Nettoyer rapporte plus qu’un signalement : le type <b>plus 40 pts</b> de bonus.',
    'Source : les signalements ouverts');
  asCard('Zones à nettoyer', 'Photo avant, ménage, photo après', top.map(r => [TYPES[r.type].icon, TYPES[r.type].label, r.address, '+' + (TYPES[r.type].points + 40) + ' pts']));
  asSay('Choisissez-en une et je vous ouvre le parcours : je vous demanderai la photo avant, puis la photo après, et l’IA vérifiera que l’endroit n’a pas changé.', null);
  asChoices(top.map(r => ({ id:'nettoyer:' + r.id, label: r.address, icon:TYPES[r.type].icon })));
}
function asStartCleanup(id){
  asSay('C’est parti pour <b>' + esc(reportById(id).address) + '</b>. Le parcours : photo avant, ménage, photo après. Vous n’avez rien à chercher, il est ouvert.', null);
  asChoices([{ id:'open:nettoyage/' + id, label:'Ouvrir le nettoyage', icon:'camera', go:true }]);
}

/* Signaler : le parcours guidé. L'utilisateur donne une photo, Green propose
   type + emplacement + description, et attend le feu vert. Rien n'est écrit
   avant la validation. */
function asFlowSignaler(){
  asSay('Décrivez-moi ce que vous avez vu, ou donnez-moi directement une photo : je m’occupe de la description, de la catégorie et de l’emplacement. Vous validez avant l’envoi.',
    'Choisissez une proposition ou écrivez votre réponse');
  asChoices([
    { id:'photo', label:'Envoyer une photo', icon:'camera', go:true },
    { id:'decrire', label:'Je vais le décrire', icon:'list' },
    { id:'menu', label:'Autre chose', icon:'list' }
  ]);
}
/* Analyse d'image : démonstration. Le type est deviné de façon déterministe à
   partir de l'image, jamais prétendu être une vraie classification. */
function asGuessType(src){
  const keys = Object.keys(TYPES);
  let h = 0;
  for (let i = 0; i < src.length; i += 7) h = (h * 31 + src.charCodeAt(i)) >>> 0;
  return keys[h % keys.length];
}
function asPickPhoto(){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*';
  input.onchange = () => {
    const f = input.files && input.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => asPropose(reader.result);
    reader.readAsDataURL(f);
  };
  input.click();
}
function asPropose(src){
  const d = document.createElement('div');
  d.className = 'msg me';
  d.innerHTML = '<img src="' + src + '" alt="Photo du déchet envoyée à l’assistant">';
  asLog.appendChild(d);
  const cat = asGuessType(src);
  const place = PLACE_GEO[0].key + ' (Rohero)';
  const t = TYPES[cat];
  asDraft = { cat, place, note:'' };
  asSay('J’ai lu l’image. Voici ce que je propose :<br><span class="ml">· <b>' + t.label + '</b> — c’est ce que je distingue le mieux.<br>· <b>' + place + '</b> — votre position GPS.<br>· La description : je la rédige à partir de la photo.</span>', null);
  asCard('Rédaction proposée', 'Vérifiez avant l’envoi',
    [['spark', t.label, 'Catégorie proposée', '+' + t.points + ' pts'],
     ['pin', place, 'Emplacement', 'GPS'],
     ['info', 'Photo et catégorie déjà choisies', 'Il ne manque que votre accord', '']]);
  asSay('Est-ce que je lance le signalement comme ça ? Vous pouvez corriger la catégorie si elle est fausse.', null);
  asChoices([
    { id:'confirm', label:'Oui, lance le signalement', icon:'send', go:true },
    { id:'cat', label:'Corriger la catégorie', icon:'refresh' },
    { id:'menu', label:'Autre chose', icon:'list' }
  ]);
  asScroll();
}
function asConfirmDraft(){
  if (!asDraft){ asMenu(); return; }
  const { cat, place } = asDraft;
  const t = TYPES[cat];
  asDraft = null;
  publishReport(cat, place, 'Signalement créé avec l’assistant Green à partir d’une photo.', () => {
    asSay('C’est fait. <b>' + t.label + '</b> signalé à ' + place + ' · <b>+' + t.points + ' points</b> pour vous. Il est visible sur la carte.', null);
    asChoices([{ id:'menu', label:'Continuer', icon:'list', go:true }]);
  });
  asScroll();
}
function asCorrectCat(){
  if (!asDraft){ asMenu(); return; }
  asSay('Quelle catégorie correspond le mieux ?', null);
  asChoices(Object.keys(TYPES).map(k => ({
    id:'setcat:' + k,
    label: TYPES[k].label,
    icon: TYPES[k].icon,
    go: asDraft.cat === k
  })));
}

/* Ouverture / fermeture. Le bouton flottant reste derrière le panneau. */
function asOpen(){
  asEl.classList.add('on');
  document.getElementById('fabAssistant').setAttribute('aria-expanded','true');
  document.body.style.overflow = 'hidden';
  if (!asLog.children.length) asHello();
  else asScroll();
  const f = document.getElementById('asInput');
  if (f) f.focus();
}
function asClose(){
  asEl.classList.remove('on');
  document.getElementById('fabAssistant').setAttribute('aria-expanded','false');
  document.body.style.overflow = '';
}
document.getElementById('fabAssistant').addEventListener('click', asOpen);
document.getElementById('asClose').addEventListener('click', asClose);
document.getElementById('asScrim').addEventListener('click', asClose);
document.getElementById('asForm').addEventListener('submit', e => {
  e.preventDefault();
  const v = asInput.value.trim();
  if (!v) return;
  asInput.value = '';
  asMe(v);
  /* Le champ libre est un raccourci, pas un chatbot : Green le lit, puis
     renvoie vers une proposition. Jamais de reponse libre inventee. */
  const low = v.toLowerCase();
  if (/photo|image|camera|envoy/.test(low))            { asPickPhoto(); }
  else if (/nettoy|ramass|zone|endroit/.test(low))    { AS_ACTIONS.nettoyer(); }
  else if (/defi|tache|challenge/.test(low))          { AS_ACTIONS.defis(); }
  else if (/point|scor|niveau|classement/.test(low))  { AS_ACTIONS.points(); }
  else if (/alerte|rouge|org|competent/.test(low))     { AS_ACTIONS.alertes(); }
  else {
    asSay('J’ai compris « ' + esc(v) + ' ». Voici ce que je sais faire — choisissez une proposition :', 'Source : votre message');
    asChoices(AS_MENU.map(o => ({ id:o.id, label:o.label, icon:o.icon })));
  }
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-as]');
  if (!b) return;
  const raw = b.getAttribute('data-as');
  /* Une proposition consommée disparaît : une seule action à la fois, donc
     pas d'état intermédiaire que l'utilisateur ne comprendrait pas. */
  asOpts.innerHTML = '';
  const i = raw.indexOf(':');
  const cmd = i < 0 ? raw : raw.slice(0, i);
  const arg = i < 0 ? '' : raw.slice(i + 1);
  switch (cmd){
    case 'photo':   asPickPhoto(); break;
    case 'decrire': asDescribe(); break;
    case 'desc':    asFromDesc(arg); break;
    case 'confirm': asConfirmDraft(); break;
    case 'cat':     asCorrectCat(); break;
    case 'setcat':  asSetCat(arg); break;
    case 'nettoyer':asStartCleanup(arg); break;
    case 'open':    asClose(); location.hash = '#/' + arg; break;
    case 'goalerte':asClose(); location.hash = '#/carte'; break;
    default:        if (AS_ACTIONS[cmd]) AS_ACTIONS[cmd]();
  }
});
/* Décrire sans photo : l'utilisateur choisit un type, Green rédige et attend
   l'accord, exactement comme après une photo — même chemin, même validation. */
function asDescribe(){
  asSay('Dites-moi ce que vous avez vu : quel type de déchet. Je rédige la description, je prends votre position, et vous validez avant l’envoi.', null);
  asChoices(Object.keys(TYPES).map(k => ({ id:'desc:' + k, label:TYPES[k].label, icon:TYPES[k].icon })));
}
function asFromDesc(cat){
  const t = TYPES[cat];
  if (!t){ asMenu(); return; }
  const place = PLACE_GEO[0].key + ' (Rohero)';
  asDraft = { cat, place, note:'' };
  asSay('Compris. Voici ce que je rédige :<span class="ml">' + t.label.toLowerCase() + ' signalé à ' + place + '. Votre position GPS est déjà attachée, vous n’avez rien à saisir.</span>', null);
  asCard('Rédaction proposée', 'Vérifiez avant l’envoi',
    [['spark', t.label, 'Catégorie retenue', '+' + t.points + ' pts'],
     ['pin', place, 'Votre position', 'GPS'],
     ['info', 'Description rédigée par Green', 'Il ne manque que votre accord', '']]);
  asSay('Je lance le signalement ?', null);
  asChoices([
    { id:'confirm', label:'Oui, lance le signalement', icon:'send', go:true },
    { id:'cat', label:'Corriger la catégorie', icon:'refresh' },
    { id:'menu', label:'Autre chose', icon:'list' }
  ]);
}
function asSetCat(cat){
  if (!asDraft || !TYPES[cat]){ asMenu(); return; }
  asDraft.cat = cat;
  asSay('Catégorie retenue : <b>' + TYPES[cat].label + '</b>. Je relance ?', null);
  asChoices([
    { id:'confirm', label:'Oui, lance le signalement', icon:'send', go:true },
    { id:'menu', label:'Autre chose', icon:'list' }
  ]);
}

   le formulaire écrit dans le même state que le reste de l'app, donc le
   profil créé ici est immédiatement le profil affiché partout.       */
