<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#122314" />
<title>Greenshot — signalez, nettoyez, grimpez</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Boldonse&family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
:root{
  --forest:#122314; --forest-2:#0e1c10; --forest-3:#0a1509;
  --panel:#172a19; --panel-2:#1e3520; --line:rgba(255,255,255,.09); --line-2:#2c4630;
  --moss:#273f2b; --lichen:#a7ac9a; --fern:#b7bda5;
  --sprout:#68ef3f; --sprout-2:#8ff56a; --verdant:#26a200;
  --wash:#e7f9dd; --mist:#d9deca; --onyx:#30322a; --bone:#f2f5eb;
  --white:#ffffff; --carbon:#222222; --stone:#d6d6d6; --danger:#ff7452; --amber:#f2c14e;
  --r-pill:999px; --r-card:20px; --r-sm:14px; --r-xs:10px;
  --dur-1:170ms; --dur-2:260ms; --dur-3:400ms;
  --ease-out:cubic-bezier(.22,.61,.36,1); --ease-in:cubic-bezier(.4,0,1,1);
  --font-display:'Boldonse',system-ui,-apple-system,sans-serif;
  --font-ui:'Geist','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-serif:'Instrument Serif',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:radial-gradient(circle at 50% -8%,rgba(104,239,63,.12),transparent 42%) fixed,var(--forest-3);
  color:var(--white);font-family:var(--font-ui);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
a,button,input,select,textarea,label{touch-action:manipulation}
#app{
  position:relative;height:100dvh;display:grid;
  grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;
  grid-template-areas:"main" "nav";
  background:var(--forest);color:var(--white);font-family:var(--font-ui);
}
.ic{width:22px;height:22px;display:block;flex:none}
.ic.sm{width:18px;height:18px}.ic.xs{width:15px;height:15px}.ic.lg{width:26px;height:26px}
:where(.btn,.navitem,.chip,.iconbtn,.catbtn,.avatar-opt,.link,a,button,.rowcard,.sw):focus-visible{outline:2px solid var(--sprout);outline-offset:2px;border-radius:10px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}

.app-main{grid-area:main;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.app-main::-webkit-scrollbar{display:none}
.app-main.is-locked{overflow:hidden}

/* barre d'écran : mobile d'abord — encoche + Status bar + respiration sous le titre */
.sbar{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:12px;
  padding:calc(30px + env(safe-area-inset-top)) 20px 18px;
  background:linear-gradient(to bottom,var(--forest) 62%,rgba(18,35,20,.74));backdrop-filter:blur(14px)}
.sbar .sbar-title{flex:1 1 auto;min-width:0;display:grid;gap:6px}
.sbar h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:22px;line-height:1.2;letter-spacing:-.01em}
.sbar .sub{font-size:13.5px;line-height:1.5;color:var(--fern);letter-spacing:.005em}
/* filet lumineux discret qui sépare le titre du contenu — évite l'effet « collé en haut » */
.sbar::after{content:"";position:absolute;left:20px;right:20px;bottom:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(104,239,63,.22) 22%,rgba(104,239,63,.22) 78%,transparent)}
.sbar > *{position:relative;z-index:1}
.pad{padding:22px 20px 40px}
.pad-b{padding-bottom:48px}

/* ── Primitives de mise en page partagées ────────────────────────────────────
   Trois classes, une seule idée : une icône, un texte, une valeur, un chevron.
   Elles doivent se tenir sur UNE ligne, avec le texte qui occupe l'espace
   restant et une gouttière régulière entre les éléments. Sans elles, les
   enfants s'empilent en texte collé — d'où les rangées illisibles. */
.od-stack{display:grid;gap:var(--od-gap,12px)}
.od-cluster{display:flex;flex-wrap:wrap;gap:var(--od-gap,8px)}
.od-row{display:flex;align-items:center;gap:var(--od-gap,13px)}
.od-fill{flex:1 1 auto;min-width:0}
.lr-go{flex:none;color:var(--lichen);transition:color var(--dur-2) var(--ease-out),transform var(--dur-2) var(--ease-out)}

.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--fern);border:1px solid var(--line);background:rgba(255,255,255,.02);transition:color var(--dur-1) var(--ease-out),border-color var(--dur-1) var(--ease-out)}
.iconbtn:hover{color:var(--white);border-color:var(--line-2)}
.pill{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:var(--r-pill);background:var(--wash);color:var(--onyx);font-size:13.5px;font-weight:600}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--verdant)}
.pill.on-dark{background:rgba(104,239,63,.14);color:var(--sprout);border:1px solid rgba(104,239,63,.3)}
.pill.on-dark .dot{background:var(--sprout)}
.pill.ghost{background:rgba(255,255,255,.05);color:var(--fern);border:1px solid var(--line)}
.pill.ghost .dot{background:var(--fern)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:var(--r-sm);font-size:15px;font-weight:600;letter-spacing:-.005em;transition:transform var(--dur-1) var(--ease-out),filter var(--dur-1) var(--ease-out),background var(--dur-1) var(--ease-out),color var(--dur-1) var(--ease-out),border-color var(--dur-1) var(--ease-out)}
.btn:active{transform:scale(.975)}
.btn-primary{background:var(--sprout);color:var(--onyx)}
.btn-primary:hover{filter:brightness(1.07)}
.btn-secondary{background:transparent;color:var(--white);border:1px solid var(--line-2)}
.btn-secondary:hover{border-color:var(--sprout);color:var(--sprout)}
/* variante sur fond clair (hero-card) : texte sombre sur fond clair */
.hero-card .btn-secondary{color:var(--onyx);border-color:rgba(48,50,42,.3)}
.hero-card .btn-secondary:hover{color:#1b1d17;border-color:var(--onyx);background:rgba(48,50,42,.08)}
.btn-light{background:var(--onyx);color:var(--bone)}
.btn-light:hover{background:#3b3d33}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn-sm{min-height:44px;padding:0 16px;font-size:14px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);padding:18px}
.card.light{background:var(--bone);color:var(--onyx);border-color:transparent}
.card.wash{background:var(--wash);color:var(--onyx);border-color:transparent}
.card.flat{background:rgba(255,255,255,.03)}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--lichen)}
.card.light .eyebrow,.card.wash .eyebrow{color:#6c7160}
.h-sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 12px}
.h-sec h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}
.h-sec .link{font-size:13.5px;font-weight:600;color:var(--sprout);display:inline-flex;align-items:center;gap:4px}
.muted{color:var(--fern)}
.dim{color:var(--lichen)}

.hero-card{padding:22px;border-radius:24px;background:linear-gradient(150deg,var(--bone),#e9eee0);color:var(--onyx);position:relative;overflow:hidden}
.hero-card::after{content:"";position:absolute;right:-46px;top:-58px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle at 40% 40%,rgba(104,239,63,.5),rgba(38,162,0,.06) 62%,transparent 72%)}
.hero-card .lvl{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#4f5546;line-height:1.3}
.hero-card .pts{font-family:var(--font-display);font-weight:400;font-size:clamp(38px,12vw,50px);line-height:1;letter-spacing:-.02em;margin:12px 0 4px;display:flex;align-items:baseline;gap:6px}
.hero-card .pts small{font-family:var(--font-ui);font-size:14px;font-weight:600;letter-spacing:0;color:#5c6250}
.hero-card .to-next{font-size:13.5px;font-weight:500;color:#5c6250;line-height:1.5}
.xp{margin-top:14px;height:10px;border-radius:99px;background:rgba(48,50,42,.14);overflow:hidden}
.xp i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--verdant),var(--sprout));transform-origin:left;animation:xpFill var(--dur-3) var(--ease-out) both}
@keyframes xpFill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.hero-actions{display:flex;gap:10px;margin-top:16px;position:relative;z-index:1;flex-wrap:wrap}

.statstrip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 14px 15px}
.stat b{font-family:var(--font-display);font-weight:400;font-size:24px;letter-spacing:-.01em;color:var(--sprout)}
.stat span{font-size:12.5px;color:var(--fern);line-height:1.45;display:block;margin-top:5px}

.rowcard{display:flex;align-items:center;gap:14px;width:100%;padding:15px 16px;border-radius:var(--r-sm);background:var(--panel);border:1px solid var(--line);text-align:left;transition:border-color var(--dur-1) var(--ease-out),background var(--dur-1) var(--ease-out)}
.rowcard:hover{border-color:var(--line-2);background:var(--panel-2)}
.rowcard + .rowcard{margin-top:11px}
.tico{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:12px;background:rgba(104,239,63,.12);color:var(--sprout);border:1px solid rgba(104,239,63,.22)}
.rowcard .body{flex:1 1 auto;min-width:0;display:block}
.rowcard .t1{display:block;font-size:15px;font-weight:600;letter-spacing:-.005em;line-height:1.35}
.rowcard .t2{display:block;font-size:13px;color:var(--fern);margin-top:4px;line-height:1.4}
.rowcard .meta{flex:none;text-align:right;display:grid;gap:6px;justify-items:end}
.pts-tag{font-size:12.5px;font-weight:700;color:var(--sprout);white-space:nowrap}
.chev{color:var(--lichen)}

.badge-status{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:99px;border:1px solid transparent;white-space:nowrap}
.st-open{background:rgba(104,239,63,.13);color:var(--sprout);border-color:rgba(104,239,63,.28)}
.st-prog{background:rgba(242,193,78,.14);color:var(--amber);border-color:rgba(242,193,78,.3)}
.st-done{background:rgba(255,255,255,.06);color:var(--fern);border-color:var(--line)}

.filter{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;padding:4px 18px 8px;scroll-snap-type:x proximity}
.filter::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;height:42px;padding:0 15px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--fern);font-size:13.5px;font-weight:500;white-space:nowrap;transition:all var(--dur-1) var(--ease-out)}
.chip .ic{width:16px;height:16px}
.chip[aria-pressed="true"]{background:var(--sprout);border-color:var(--sprout);color:var(--onyx);font-weight:600}
.chip-sw{width:12px;height:12px;flex:none}
.chip[aria-pressed="true"] .chip-sw{box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}

.nearby-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:28px 0 10px}
.nearby-head h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}
.nearby-head .link{font-size:13px;font-weight:600;color:var(--sprout);display:inline-flex;align-items:center;gap:5px}
.nearby-stamp{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fern);margin:0 0 14px}
.nearby-stamp .live{width:7px;height:7px;border-radius:50%;background:var(--sprout);box-shadow:0 0 0 0 rgba(104,239,63,.5);animation:livePulse 2s var(--ease-out) infinite}
@keyframes livePulse{0%{box-shadow:0 0 0 0 rgba(104,239,63,.5)}70%,100%{box-shadow:0 0 0 7px rgba(104,239,63,0)}}

/* ── Écran Carte ──────────────────────────────────────────────────────
   Le moteur cartographique (MapLibre GL JS) vit dans carte-burundi-3d.html ;
   cet écran se contente de l'afficher. Un seul moteur, un seul fond de carte. */
.mapwrap{position:relative;height:100%;overflow:hidden;background:var(--forest-3)}
.map-embed{display:block;width:100%;height:100%;border:0;background:var(--forest-3)}

.shp{display:grid;place-items:center}
.shp.circle{border-radius:50%}
.shp.square{border-radius:28%}
.shp.diamond{clip-path:polygon(50% 2%,98% 50%,50% 98%,2% 50%)}
.shp.hex{clip-path:polygon(25% 3%,75% 3%,99% 50%,75% 97%,25% 97%,1% 50%)}
.shp.triangle{clip-path:polygon(50% 6%,96% 94%,4% 94%)}
.shp.teardrop{clip-path:polygon(50% 0,78% 22%,96% 52%,78% 88%,50% 100%,22% 88%,4% 52%,22% 22%)}
.shp.triangle > .ic{transform:translateY(24%) scale(.8)}
.shp.diamond > .ic{transform:scale(.82)}
.shp.teardrop > .ic{transform:translateY(-14%) scale(.86)}

.catgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.catbtn{display:flex;align-items:center;gap:11px;padding:14px 13px;border-radius:var(--r-sm);border:1px solid var(--line);background:rgba(255,255,255,.03);text-align:left;transition:all var(--dur-1) var(--ease-out)}
.catbtn .ci{width:36px;height:36px;flex:none;color:#08130a}
.catbtn .cl{font-size:13.5px;font-weight:500;line-height:1.3}
.catbtn[aria-pressed="true"]{border-color:var(--sprout);background:rgba(104,239,63,.12)}
.catbtn[aria-pressed="true"] .cl{color:var(--sprout);font-weight:600}

/* ── Hub Signaler : deux portes d'entree de meme niveau, dans un seul segment.
   C'est un choix binaire, pas deux cartes a comparer : une seule surface levee
   par le segment actif, et une ligne de texte qui dit ce que ca donne. ───── */
.hub{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:0 var(--pad) 12px;padding:5px;
  background:var(--panel-2);border:1px solid var(--line);border-radius:19px}
.hub-btn{display:grid;justify-items:center;align-content:center;gap:8px;padding:15px 8px;
  min-height:88px;border-radius:15px;background:transparent;border:1px solid transparent;
  text-align:center;color:var(--lichen);
  transition:background var(--dur-1) var(--ease-out),color var(--dur-1) var(--ease-out),box-shadow var(--dur-1) var(--ease-out)}
.hub-btn .hi{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;
  background:rgba(255,255,255,.06);color:var(--fern);
  transition:background var(--dur-1) var(--ease-out),color var(--dur-1) var(--ease-out)}
.hub-btn .hi .ic{width:21px;height:21px}
.hub-btn b{display:block;font-size:14.5px;font-weight:600;line-height:1.25;color:inherit}
.hub-btn:hover{background:rgba(255,255,255,.05);color:var(--white)}
.hub-btn[aria-pressed="true"]{background:var(--sprout);border-color:var(--sprout);color:var(--onyx);
  box-shadow:0 6px 18px rgba(104,239,63,.2)}
.hub-btn[aria-pressed="true"] .hi{background:rgba(10,21,9,.16);color:var(--onyx)}
.hub-note{margin:0 var(--pad) 22px;font-size:12.5px;line-height:1.5;color:var(--fern);text-align:center;min-height:19px}

.pick-hint{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:20px 0 12px}
.pick-hint h2{font-size:15px;font-weight:600}
.pick-hint span{font-size:12.5px;color:var(--lichen)}
.pickrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px;
  border-radius:var(--r-sm);background:var(--panel-2);border:1px solid var(--line);color:var(--fern);
  transition:background var(--dur-1) var(--ease-out),border-color var(--dur-1) var(--ease-out)}
.pickrow:hover{background:oklch(from var(--panel-2) calc(l + .06) c h);border-color:rgba(104,239,63,.42);color:var(--white)}
.pickrow .body{flex:1 1 auto;min-width:0}
.pickrow .body .t1{display:block;font-size:14.5px;font-weight:600;line-height:1.35}
.pickrow .body .t2{display:block;font-size:12.5px;color:var(--lichen);margin-top:2px;line-height:1.4}
.pickrow .gain{flex:none;font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--sprout);
  padding:5px 9px;border-radius:99px;background:rgba(104,239,63,.12);border:1px solid rgba(104,239,63,.28)}
.pickrow .lr-go{flex:none;color:var(--lichen)}
.pickrow:hover .lr-go{color:var(--sprout)}

/* Comparatif avant / apres : les deux images a taille egale, alignees sur la
   meme ligne de base, pour que l oeil les compare sans effort. */
.ba-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.ba-slot{display:grid;gap:6px;position:relative}
.ba-lb{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--lichen)}
.ba-slot img{width:100%;aspect-ratio:1/1;object-fit:contain;background:#0a1509;
  border-radius:14px;border:1px solid var(--line)}
.ba-drop{display:grid;place-items:center;align-content:center;gap:8px;aspect-ratio:1/1;
  border-radius:14px;border:1.5px dashed var(--line-2);background:rgba(255,255,255,.03);
  color:var(--lichen);cursor:pointer;transition:border-color var(--dur-1) var(--ease-out),color var(--dur-1) var(--ease-out),background var(--dur-1) var(--ease-out)}
.ba-drop:hover{border-color:var(--sprout);color:var(--sprout);background:rgba(104,239,63,.07)}
.ba-drop .ba-hint{font-size:11.5px;line-height:1.3;text-align:center;padding:0 6px}
.ba-ret{position:absolute;right:8px;bottom:8px;width:32px;height:32px;
  background:rgba(10,21,9,.85);backdrop-filter:blur(6px)}
.ba-ret:hover{background:var(--sprout);color:var(--onyx);border-color:var(--sprout)}

/* Verdict de l IA : la ligne qui dit si l endroit est bien le meme. */
.vsite{display:flex;align-items:flex-start;gap:11px;padding:13px 14px;margin-top:14px;
  border-radius:var(--r-sm);background:rgba(104,239,63,.09);border:1px solid rgba(104,239,63,.3)}
.vsite .vsi{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  background:var(--sprout);color:var(--onyx)}
.vsite b{display:block;font-size:13.5px;color:var(--white);line-height:1.35}
.vsite span{display:block;font-size:12.5px;color:var(--fern);margin-top:2px;line-height:1.45}
.vsite.warn{background:rgba(242,193,78,.1);border-color:rgba(242,193,78,.34)}
.vsite.warn .vsi{background:var(--amber);color:var(--onyx)}

/* ── Activité : une grille de contributions plutôt qu'une liste. Le principe est
   celui de GitHub : la régularité se LIT d'un coup d'œil, sans lire un mot. Sur
   mobile la grille est fixe, jamais defilante, et chaque jour estTouchable. ─── */
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat-cell{aspect-ratio:1;border-radius:4px;background:rgba(255,255,255,.05);
  border:1px solid transparent;position:relative;transition:transform var(--dur-1) var(--ease-out)}
.heat-cell:hover{transform:scale(1.14);border-color:var(--sprout)}
.heat-cell[data-lv="1"]{background:rgba(104,239,63,.24)}
.heat-cell[data-lv="2"]{background:rgba(104,239,63,.46)}
.heat-cell[data-lv="3"]{background:rgba(104,239,63,.72)}
.heat-cell[data-lv="4"]{background:var(--sprout)}
.heat-cell.today{box-shadow:0 0 0 2px var(--white),0 0 0 4px rgba(104,239,63,.5)}
.heat-scale{display:flex;align-items:center;gap:5px;margin-top:12px;justify-content:flex-end;
  font-size:11px;color:var(--lichen)}
.heat-scale i{width:10px;height:10px;border-radius:3px;display:block}
.heat-days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:7px}
.heat-days span{font-size:10.5px;font-weight:600;color:var(--lichen);text-align:center;letter-spacing:.04em}

/* Le feu de regularite. Il dit ce qu'on a fait cette semaine, et ce qu'il reste
   pour la prolongation : c'est un encouragement, pas une sanction.
   Version barre : sept pastilles alignees, lisibles d'un coup d oeil. */
.streak{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:var(--r-card);
  background:linear-gradient(100deg,rgba(242,193,78,.16),rgba(242,193,78,.05));
  border:1px solid rgba(242,193,78,.3);text-align:left;width:100%;color:var(--fern);
  transition:border-color var(--dur-1) var(--ease-out),background var(--dur-1) var(--ease-out)}
.streak:hover{border-color:rgba(242,193,78,.55);background:linear-gradient(100deg,rgba(242,193,78,.22),rgba(242,193,78,.08))}
.streak .fl{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  background:rgba(242,193,78,.2);color:var(--amber)}
.streak b{display:block;font-size:14.5px;font-weight:700;color:var(--white);line-height:1.3}
.streak .od-fill>span{display:block;font-size:12.5px;color:var(--fern);margin-top:3px;line-height:1.45}
.streak .lr-go{flex:none;color:var(--amber)}

/* La serie, dans la barre de titre : a cote du prenom, sur la meme ligne.
   C'est la lecon qu'on donne, elle ne doit pas etre relanguee plus bas. */
/* La zone droite de la barre de titre : deux indicateurs empiles, alignes a
   droite. Ils respirent du titre au lieu de le repousser. */
.sbar-right{flex:none;display:grid;justify-items:end;gap:9px}

.streakbar{display:grid;justify-items:end;gap:7px;flex:none;padding:2px 0;
  color:var(--fern);transition:opacity var(--dur-1) var(--ease-out)}
.streakbar:hover{opacity:.82}
.streakbar .sb-top{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;
  background:rgba(242,193,78,.13);border:1px solid rgba(242,193,78,.3)}
.streakbar .sb-top .ic{width:15px;height:15px;color:var(--amber)}
.streakbar .sb-top b{font-size:12.5px;font-weight:700;color:var(--amber);line-height:1;white-space:nowrap}

/* Les sept pastilles : une rangee horizontale, jamais empilee. */
.spark-dots{display:flex;gap:4px;justify-content:flex-end}
.spark-dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.16);display:block;flex:none}
.spark-dots i.on{background:var(--sprout);box-shadow:0 0 5px rgba(104,239,63,.55)}

/* La page d'un jour : ouverte depuis la grille, elle affiche ce jour-la et rien
   d'autre. C'est le detail qu'on vient chercher, pas un ajout a l'accueil. */
.day-hero{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:18px 16px;border-radius:var(--r-card);background:rgba(104,239,63,.1);
  border:1px solid rgba(104,239,63,.28)}
.day-hero b{font-family:var(--font-display);font-weight:400;font-size:28px;color:var(--sprout);line-height:1}
.day-hero span{font-size:13px;color:var(--fern);text-align:right;line-height:1.4}

.capture{position:relative;width:100%;aspect-ratio:4/3;border-radius:var(--r-card);border:1.5px dashed var(--line-2);background:rgba(255,255,255,.025);overflow:hidden;display:grid;place-items:center;text-align:center;gap:8px;color:var(--fern);transition:border-color var(--dur-1) var(--ease-out)}
.capture:hover{border-color:var(--sprout);color:var(--white)}
.capture img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#0a1509}
.capture .cap-face{display:grid;justify-items:center;gap:9px;padding:18px}
.capture .cap-face .cic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:rgba(104,239,63,.13);color:var(--sprout);border:1px solid rgba(104,239,63,.24)}
.capture .cap-note{font-size:12.5px;color:var(--lichen);line-height:1.4}
.capture .tagdemo{position:absolute;left:12px;bottom:12px;font-size:11px;font-weight:600;padding:4px 9px;border-radius:99px;background:rgba(10,21,9,.8);color:var(--fern);border:1px solid var(--line)}
.capture .rephot{position:absolute;right:12px;bottom:12px}
.field{display:grid;gap:11px}
.field > label{font-size:14.5px;font-weight:600;color:var(--white);letter-spacing:-.005em}
.field .help,.help{font-size:13px;color:var(--lichen);line-height:1.55}
.input,select.input,textarea.input{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:var(--r-sm);color:var(--white);font-family:inherit;font-size:15px;padding:14px 15px;min-height:52px;transition:border-color var(--dur-1) var(--ease-out)}
.input::placeholder{color:var(--lichen)}
.input:focus{border-color:var(--sprout);outline:none}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--fern) 50%),linear-gradient(135deg,var(--fern) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 14px) 21px;background-size:6px 6px;background-repeat:no-repeat}
.req{color:var(--sprout)}
.fields{display:grid;gap:28px}

.photostage{aspect-ratio:1/1;border-radius:var(--r-card);overflow:hidden;border:1px solid var(--line);position:relative;background:rgba(255,255,255,.03);display:grid;place-items:center}
.photostage img{width:100%;height:100%;object-fit:contain;background:#0a1509}
.photostage .empty{display:grid;justify-items:center;gap:8px;color:var(--lichen);padding:20px;text-align:center}

.steps{display:flex;align-items:center;gap:6px}
.steps .step{flex:1 1 0;height:4px;border-radius:99px;background:rgba(255,255,255,.12)}
.steps .step.on{background:var(--sprout)}

.ai-panel{border-radius:var(--r-card);border:1px solid rgba(104,239,63,.3);background:linear-gradient(160deg,rgba(104,239,63,.12),rgba(104,239,63,.03));padding:18px}
.ai-head{display:flex;align-items:center;gap:10px}
.ai-head .orb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 36% 34%,var(--sprout-2),var(--verdant));color:var(--forest);flex:none}
.ailine{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:9px 0;color:var(--fern)}
.ailine .rd{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none}
.ailine.done{color:var(--white)}
.ailine.done .rd{background:var(--sprout);border-color:var(--sprout);color:var(--onyx)}
.ailine .spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(104,239,63,.25);border-top-color:var(--sprout);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.confbar{height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:6px}
.confbar i{display:block;height:100%;background:linear-gradient(90deg,var(--verdant),var(--sprout));transition:width var(--dur-3) var(--ease-out)}

.verdict{border-radius:var(--r-card);padding:20px;text-align:center;display:grid;gap:8px;justify-items:center}
.verdict.ok{background:var(--wash);color:var(--onyx)}
.verdict .vico{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--sprout);color:var(--onyx)}
.verdict h3{margin:0;font-size:19px;font-weight:600}
.verdict p{margin:0;font-size:13.5px;color:#5c6250;line-height:1.5;max-width:300px}
.confrow{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12.5px;font-weight:600;color:#4f5546}

.rank{padding:14px 0}
.rankrow{display:flex;align-items:center;gap:13px;padding:12px 13px;border-radius:var(--r-sm)}
.rankrow + .rankrow{margin-top:9px}
.rankrow.me{background:rgba(104,239,63,.1);border:1px solid rgba(104,239,63,.26)}
.rnum{width:26px;text-align:center;font-family:var(--font-display);font-weight:400;font-size:16px;color:var(--fern);flex:none}
.rnum.top{color:var(--sprout)}
.rankrow .nm{flex:1 1 auto;min-width:0}
.rankrow .nm b{font-size:15px;font-weight:600;display:block;line-height:1.3}
.rankrow .nm span{font-size:12.5px;color:var(--lichen);line-height:1.35}
.rbar{height:5px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:6px;max-width:180px}
.rbar i{display:block;height:100%;border-radius:99px;background:var(--sprout)}
.rankrow .rpts{display:grid;justify-items:end;gap:3px}
.rankrow .rpts em{font-style:normal;font-size:11px;color:var(--lichen);letter-spacing:.01em}
.rpts{font-family:var(--font-display);font-weight:400;font-size:16px;color:var(--sprout)}


/* ── Classement : defi, ligue, podium, groupes de niveau ── */
.bd-defi{position:relative;overflow:hidden;width:100%;text-align:left;display:grid;gap:14px;padding:20px 18px;
  border-radius:26px;border:1px solid rgba(104,239,63,.34);
  background:linear-gradient(158deg,rgba(104,239,63,.16),rgba(104,239,63,.03))}
.bd-defi::after{content:"";position:absolute;right:-52px;top:-62px;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle,rgba(104,239,63,.22),transparent 68%);pointer-events:none}
.bd-defi > *{position:relative;z-index:1}
.bd-defi .d-top{display:flex;align-items:center;gap:11px}
.bd-defi .d-ico{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;
  background:var(--sprout);color:var(--onyx);box-shadow:0 6px 16px rgba(104,239,63,.28)}
.bd-defi .d-kick{display:block;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--sprout)}
.bd-defi h3{margin:3px 0 0;font-size:17px;font-weight:600;line-height:1.25;letter-spacing:-.01em}
.bd-defi .d-go{margin-left:auto;flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;
  border:1px solid var(--line-2);color:var(--fern)}
.bd-defi:hover{border-color:rgba(104,239,63,.55);background:linear-gradient(158deg,rgba(104,239,63,.22),rgba(104,239,63,.05))}
.bd-defi:hover .d-go{border-color:var(--sprout);color:var(--sprout)}
.bd-defi .d-prog{display:flex;align-items:center;gap:11px}
.bd-defi .d-bar{flex:1 1 auto;height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.bd-defi .d-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--verdant),var(--sprout));
  transition:width var(--dur-3) var(--ease-out)}
.bd-defi .d-num{font-family:var(--font-mono);font-size:12.5px;color:var(--white);flex:none}
.bd-defi .d-num b{color:var(--sprout)}
.bd-defi .d-rew{font-size:12.5px;color:var(--fern);line-height:1.45;margin:0}

/* Liste des taches : une ligne = une icone, un libelle, une barre, une recompense. */
.tk-list{display:grid;gap:7px}
.tk-row{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:10px 11px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);
  transition:border-color var(--dur-1) var(--ease-out),background var(--dur-1) var(--ease-out)}
.tk-row:hover{border-color:rgba(104,239,63,.4);background:rgba(104,239,63,.09)}
.tk-row:focus-visible{outline:2px solid var(--sprout);outline-offset:2px}
.tk-row .tk-ico{width:32px;height:32px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:rgba(104,239,63,.12);border:1px solid rgba(104,239,63,.24);color:var(--sprout)}
.tk-row .tk-body{flex:1 1 auto;min-width:0;display:grid;gap:5px}
.tk-row .tk-body b{font-size:13px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk-row .tk-bar{height:5px;border-radius:99px;background:rgba(255,255,255,.11);overflow:hidden}
.tk-row .tk-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--verdant),var(--sprout));
  transition:width var(--dur-3) var(--ease-out)}
.tk-row .tk-sub{font-family:var(--font-mono);font-size:10.5px;color:var(--lichen)}
.tk-row .tk-pts{flex:none;min-width:38px;text-align:right;font-family:var(--font-mono);font-size:12px;
  font-weight:600;color:var(--sprout);display:grid;place-items:center}
.tk-row.done{background:rgba(104,239,63,.08);border-color:rgba(104,239,63,.3)}
.tk-row.done .tk-ico{background:var(--sprout);border-color:var(--sprout);color:var(--onyx)}
.tk-row.done .tk-body b{color:var(--fern)}

.bd-league{position:relative;overflow:hidden;display:grid;gap:14px;padding:18px 17px;border-radius:22px;
  border:1px solid var(--line);background:linear-gradient(165deg,var(--panel-2),var(--panel))}
.bd-league .l-top{display:flex;align-items:center;gap:12px}
.bd-league .l-ico{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;
  background:rgba(255,255,255,.06);color:var(--fern);border:1px solid var(--line)}
.bd-league[data-tone="gold"] .l-ico{background:rgba(242,193,78,.14);color:#f2c14e;border-color:rgba(242,193,78,.3)}
.bd-league[data-tone="silver"] .l-ico{background:rgba(211,218,230,.12);color:#d3dae6;border-color:rgba(211,218,230,.26)}
.bd-league .l-name{display:block;font-size:15px;font-weight:600;line-height:1.2}
.bd-league .l-sub{display:block;font-size:12.5px;color:var(--lichen);line-height:1.4;margin-top:3px}
.bd-league .l-rank{margin-left:auto;flex:none;text-align:right}
.bd-league .l-rank b{display:block;font-family:var(--font-display);font-size:26px;line-height:1;color:var(--sprout)}
.bd-league .l-rank span{font-size:11px;color:var(--lichen)}
.bd-league .l-track{position:relative;height:8px;border-radius:99px;background:rgba(255,255,255,.1)}
.bd-league .l-track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;
  background:linear-gradient(90deg,var(--verdant),var(--sprout))}
.bd-league .l-track b{position:absolute;top:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;
  transform:translateY(-50%);background:var(--sprout);border:2.5px solid var(--onyx);box-shadow:0 0 0 1.5px rgba(104,239,63,.45)}
.bd-league .l-track .t-you{box-shadow:0 0 0 2px rgba(104,239,63,.55),0 2px 8px rgba(0,0,0,.4)}
.bd-league .l-foot{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--lichen);line-height:1.4}
.bd-league .l-foot b{color:var(--fern);font-weight:600}

.bd-grp{display:flex;align-items:center;gap:10px;margin:22px 0 11px;padding:0 2px}
.bd-grp .g-ico{width:28px;height:28px;border-radius:9px;flex:none;display:grid;place-items:center;
  background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--fern)}
.bd-grp[data-tone="gold"] .g-ico{background:rgba(242,193,78,.14);border-color:rgba(242,193,78,.3);color:#f2c14e}
.bd-grp[data-tone="silver"] .g-ico{background:rgba(211,218,230,.12);border-color:rgba(211,218,230,.26);color:#d3dae6}
.bd-grp h3{margin:0;font-size:14px;font-weight:600;letter-spacing:.01em}
.bd-grp .g-n{font-family:var(--font-mono);font-size:11.5px;color:var(--lichen)}
.bd-grp .g-line{flex:1 1 auto;height:1px;background:var(--line)}

/* Le tableau respire. Entre deux joueurs il y a plus de blanc que de bordure :
   sur un ecran de telephone, la separation se fait par l espace, pas par un trait. */
.bd-list{display:grid;gap:12px}
.bd-row{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  min-height:72px;padding:13px 15px;border-radius:18px;border:1px solid var(--line);
  background:var(--panel);transition:border-color var(--dur-1) var(--ease-out),background var(--dur-1) var(--ease-out)}
.bd-row:hover{border-color:var(--line-2);background:var(--panel-2)}
.bd-row.me{border-color:rgba(104,239,63,.4);background:rgba(104,239,63,.09)}
.bd-row.me:hover{background:rgba(104,239,63,.14)}
.bd-row .rn{width:24px;flex:none;text-align:center;font-family:var(--font-mono);font-size:13px;color:var(--lichen)}
.bd-row .rn.top{color:var(--sprout);font-weight:700}
.bd-row .who{flex:1 1 auto;min-width:0;display:grid;gap:4px}
.bd-row .who .w-l1{display:flex;align-items:center;gap:7px;min-width:0}
.bd-row .who b{font-size:14.5px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd-row .who .w-l2{display:flex;align-items:center;gap:6px;min-width:0}
.bd-row .who .w-tag{font-size:11.5px;color:var(--lichen);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd-row .pts{flex:none;display:grid;justify-items:end;gap:3px}
.bd-row .pts b{font-family:var(--font-display);font-weight:400;font-size:16px;color:var(--white);line-height:1}
.bd-row .pts em{font-style:normal;font-family:var(--font-mono);font-size:10.5px;color:var(--lichen)}
.bd-row .pts em.up{color:var(--sprout)}

/* ── Podium : trois marches, trois tailles. Le 1er domine, le 3e s efface.
   Les numeros sont explicites, aucune place ne se devine a la silhouette. ── */
.podium{display:grid;grid-template-columns:1fr 1.22fr 1fr;gap:12px;align-items:end;margin-top:2px}
.pod{position:relative;display:grid;justify-items:center;gap:7px;width:100%;text-align:center;
  padding:16px 8px 14px;border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:none;
  background:linear-gradient(180deg,var(--panel),var(--panel-2));
  transition:border-color var(--dur-1) var(--ease-out),background var(--dur-1) var(--ease-out)}
.pod:hover{border-color:var(--line-2);background:linear-gradient(180deg,var(--panel-2),var(--panel))}
.pod:focus-visible{outline:2px solid var(--sprout);outline-offset:2px}
.pod .podbase{position:absolute;left:0;right:0;bottom:0;height:5px;border-radius:0 0 20px 20px;background:var(--line-2)}
.pod b{font-size:13px;font-weight:600;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .podpts{font-family:var(--font-display);font-size:14.5px;line-height:1;color:var(--sprout)}
.pod .podrank{position:absolute;top:-11px;left:50%;margin-left:-13px;width:26px;height:26px;border-radius:50%;
  display:grid;place-items:center;font-family:var(--font-display);font-size:15px;font-weight:600;
  border:2px solid var(--onyx);z-index:2}
.pod .av-wrap{border-radius:50%}
.pod.p1{padding-top:20px}
.pod.p1 .av-wrap,.pod.p1 .avatar-chip{width:82px;height:82px}
.pod.p1 .podrank{width:32px;height:32px;margin-left:-16px;font-size:19px;
  background:linear-gradient(160deg,#f7dfa0,var(--amber));color:#3a2a06;box-shadow:0 4px 12px rgba(242,193,78,.42)}
.pod.p1 .podbase{height:7px;background:linear-gradient(90deg,var(--amber),#f7dfa0)}
.pod.p1 b{font-size:15px}
.pod.p1 .podpts{font-size:17px}
.pod.p1{background:linear-gradient(180deg,rgba(242,193,78,.16),rgba(242,193,78,.04));
  border-color:rgba(242,193,78,.34)}
.pod.p1:hover{background:linear-gradient(180deg,rgba(242,193,78,.24),rgba(242,193,78,.07))}
.pod.p2 .podrank{background:linear-gradient(160deg,#e2e8f2,#a9b4c6);color:#1d222b}
.pod.p3 .podrank{background:linear-gradient(160deg,#d6a179,#9c6a42);color:#2a1708}
.pod.me{border-color:rgba(104,239,63,.45)}

/* Ma place isolee : elle ne se melange jamais au tableau. */
.mycard{display:flex;align-items:center;gap:12px;margin-top:14px;padding:13px 14px;border-radius:18px;
  border:1px solid rgba(104,239,63,.38);background:linear-gradient(150deg,rgba(104,239,63,.14),rgba(104,239,63,.03))}
.mycard .who{flex:1 1 auto;min-width:0;display:grid;gap:4px}
.mycard .who .w-l1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.mycard .who b{font-size:15px;font-weight:600}
.mycard .mc-rank{font-family:var(--font-mono);font-size:11.5px;color:var(--sprout)}
.mycard .who .w-l2{display:flex;align-items:center;gap:6px;min-width:0}
.mycard .w-tag{font-size:11.5px;color:var(--lichen)}
.mycard .pts{flex:none;display:grid;justify-items:end;gap:3px}
.mycard .pts b{font-family:var(--font-display);font-size:18px;font-weight:400;color:var(--white);line-height:1}
.mycard .pts em{font-style:normal;font-family:var(--font-mono);font-size:10.5px;color:var(--lichen)}
.mycard .pts em.up{color:var(--sprout)}

/* La ligne entiere est la cible : elle ouvre la fiche, ou l on suit. Le bouton
   « + » d avant a ete retire, donc la ligne reprend toute la largeur du cadre. */
.bd-row{padding:0;gap:0}
.bd-row .br-main{flex:1 1 auto;min-width:0;width:100%;display:flex;align-items:center;gap:13px;
  text-align:left;padding:13px 15px;min-height:72px;border-radius:18px;color:inherit}
.bd-row .br-main:hover{color:var(--white)}
.bd-row.me .br-main{padding-right:15px}

.bd-cats{display:grid;gap:10px}
.bd-cats .c-head{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.bd-cats .c-head .c-ico{width:26px;height:26px;border-radius:8px;flex:none;display:grid;place-items:center;
  background:rgba(104,239,63,.12);border:1px solid rgba(104,239,63,.24);color:var(--sprout)}
.bd-cats .c-head b{font-size:13px;font-weight:600}
.bd-cats .c-head span{font-family:var(--font-mono);font-size:10.5px;color:var(--lichen);margin-left:auto}
.c-champ{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:18px;
  border:1px solid rgba(104,239,63,.26);background:linear-gradient(150deg,rgba(104,239,63,.11),rgba(104,239,63,.02))}
.c-champ .c-who{flex:1 1 auto;min-width:0}
.c-champ .c-who b{display:block;font-size:14.5px;font-weight:600;line-height:1.25}
.c-champ .c-who span{font-size:11.5px;color:var(--lichen)}
.c-champ .c-pts{font-family:var(--font-display);font-size:15px;color:var(--sprout);flex:none}
.c-champ.me{border-color:var(--sprout);background:rgba(104,239,63,.16)}
.c-champ .c-you{font-family:var(--font-mono);font-size:10.5px;color:var(--sprout)}

.ply{text-align:center;display:grid;justify-items:center;gap:2px;padding:4px 0 2px}
.ply .p-av{position:relative;display:inline-grid;place-items:center;margin-bottom:12px}
.ply h3{margin:0;font-size:21px;font-weight:600;letter-spacing:-.01em}
.ply .p-sub{font-size:12.5px;color:var(--fern);margin-top:4px}
.ply .p-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-top:12px}
.ply .p-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:100%;margin-top:18px}
.ply .p-grid div{display:grid;gap:3px;justify-items:center;padding:13px 6px;border-radius:14px;
  border:1px solid var(--line);background:rgba(255,255,255,.03)}
.ply .p-grid b{font-family:var(--font-display);font-weight:400;font-size:20px;color:var(--white);line-height:1}
.ply .p-grid span{font-size:10.5px;color:var(--lichen);text-align:center;line-height:1.3}
.ply .p-rank{margin-top:14px;font-size:12.5px;color:var(--fern)}
.ply .p-rank b{color:var(--sprout)}

.av-wrap{position:relative;flex:none;display:inline-grid;place-items:center}
.av-wrap.xl{width:64px;height:64px}
.av-wrap.lg{width:52px;height:52px}
.av-wrap.sm{width:36px;height:36px}
.avatar-chip{width:44px;height:44px;border-radius:50%;flex:none;overflow:hidden;background:var(--av-bg,rgba(104,239,63,.16));border:1px solid rgba(255,255,255,.14)}
.avatar-chip img,.avatar-chip svg{width:100%;height:100%;display:block;object-fit:cover}
.avatar-chip.lg{width:52px;height:52px}
.avatar-chip.xl{width:64px;height:64px}
.avatar-chip.sm{width:36px;height:36px}
.av-wrap.me .avatar-chip{border-color:var(--sprout);box-shadow:0 0 0 3px rgba(104,239,63,.2)}
.av-wrap.r1 .avatar-chip{border-color:#f2c14e;box-shadow:0 0 0 2px rgba(242,193,78,.3)}
.av-wrap.r2 .avatar-chip{border-color:#d3dae6;box-shadow:0 0 0 2px rgba(211,218,230,.26)}
.av-wrap.r3 .avatar-chip{border-color:#e08a5b;box-shadow:0 0 0 2px rgba(224,138,91,.28)}
.av-lvl{position:absolute;right:-6px;bottom:-5px;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--onyx);color:var(--sprout);border:1px solid rgba(255,255,255,.18);box-shadow:0 2px 6px rgba(0,0,0,.35);font-size:11px;font-weight:700;line-height:20px;text-align:center;font-family:var(--font-body);white-space:nowrap}
.av-wrap.xl .av-lvl{min-width:26px;height:26px;line-height:24px;font-size:12px}
.avatar-opt .avatar-chip,.avatar-opt .av-wrap{width:52px;height:52px}
.avatargrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.avatar-opt{display:grid;justify-items:center;gap:8px;padding:14px 8px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);transition:all var(--dur-1) var(--ease-out)}
.avatar-opt .avatar-chip{width:46px;height:46px}
.avatar-opt .avatar-chip .ic{width:25px;height:25px}
.avatar-opt .lbl{font-size:11.5px;color:var(--fern);line-height:1.2}
.avatar-opt:hover{border-color:var(--line-2)}
.avatar-opt[aria-pressed="true"]{border-color:var(--sprout);background:rgba(104,239,63,.1)}
.avatar-opt[aria-pressed="true"] .lbl{color:var(--sprout)}

.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
.badge{display:grid;justify-items:center;gap:8px;text-align:center;padding:16px 10px;border-radius:var(--r-sm);border:1px solid var(--line);background:rgba(255,255,255,.03);transition:border-color var(--dur-1) var(--ease-out),background var(--dur-1) var(--ease-out)}
.badge:hover{border-color:var(--line-2)}
.badge .bi{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(104,239,63,.12);color:var(--sprout);border:1px solid rgba(104,239,63,.24)}
.badge.locked{opacity:.5}
.badge.locked .bi{background:rgba(255,255,255,.05);color:var(--lichen);border-color:var(--line)}
.badge .bn{font-size:12px;font-weight:600;line-height:1.3}
.badge .bd{font-size:11px;color:var(--lichen);line-height:1.35}
.settings-row{display:flex;align-items:center;gap:13px;width:100%;min-height:62px;padding:14px 0;border-bottom:1px solid var(--line);text-align:left}
.settings-row:last-child{border-bottom:none}
.settings-row .si{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.05);color:var(--fern)}
/* Ligne de navigation vers une sous-page : meme grammaire qu une ligne de reglages,
   mais elle ouvre une page au lieu de basculer un interrupteur. */
.linkrow{display:flex;align-items:center;gap:13px;width:100%;min-height:64px;padding:14px 15px;
  text-align:left;text-decoration:none;color:inherit;border-radius:14px;
  background:rgba(255,255,255,.035);border:1px solid var(--line);transition:background var(--dur-2),border-color var(--dur-2)}
.linkrow + .linkrow{margin-top:9px}
.linkrow:hover{background:rgba(104,239,63,.09);border-color:rgba(104,239,63,.5)}
.linkrow:focus-visible{outline:2px solid var(--sprout);outline-offset:2px}
.linkrow .li{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;
  background:rgba(104,239,63,.14);color:var(--sprout)}
.linkrow b{display:block;font-size:14px;font-weight:600;line-height:1.3}
.linkrow span.ls{display:block;font-size:12.5px;color:var(--fern);line-height:1.4;margin-top:2px}
.linkrow .lr-go{margin-left:auto;flex:none;color:var(--lichen);transition:color var(--dur-2),transform var(--dur-2)}
.linkrow:hover .lr-go{color:var(--sprout);transform:translateX(2px)}
.sw{margin-left:auto;width:46px;height:28px;border-radius:99px;background:rgba(255,255,255,.12);position:relative;transition:background var(--dur-2) var(--ease-out);flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--white);transition:transform var(--dur-2) var(--ease-out)}
.sw[aria-checked="true"]{background:var(--sprout)}
.sw[aria-checked="true"]::after{transform:translateX(18px);background:var(--onyx)}


/* ── Identité : avatar centré, une seule action d'édition ───────── */
.pf-id{position:relative;overflow:hidden;display:grid;justify-items:center;text-align:center;
  padding:26px 20px 22px;border-radius:26px;border:1px solid var(--line);
  background:linear-gradient(165deg,var(--panel-2),var(--panel))}
.pf-id::after{content:"";position:absolute;left:50%;top:-96px;width:260px;height:260px;transform:translateX(-50%);
  border-radius:50%;background:radial-gradient(circle,rgba(104,239,63,.16),transparent 68%);pointer-events:none}
.pf-id > *{position:relative;z-index:1}
.pf-avbtn{position:relative;display:block;padding:0;border-radius:50%;line-height:0}
.pf-avbtn .avatar-chip{width:104px;height:104px;border-width:2px;border-color:rgba(104,239,63,.5);box-shadow:0 0 0 4px rgba(104,239,63,.12)}
.pf-pencil{position:absolute;right:-2px;bottom:-2px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
  background:var(--sprout);color:var(--onyx);border:3px solid var(--panel);transition:transform var(--dur-1) var(--ease-out),filter var(--dur-1) var(--ease-out)}
.pf-avbtn:hover .pf-pencil{transform:scale(1.08)}
.pf-avbtn:hover .avatar-chip{border-color:var(--sprout)}
.pf-name{margin:16px 0 0;font-family:var(--font-display);font-weight:400;font-size:24px;line-height:1.15;letter-spacing:-.01em}
.pf-sub{margin:7px 0 0;font-size:13.5px;line-height:1.5;color:var(--fern)}
.pf-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}
.pf-photo{width:104px;height:104px;border-radius:50%;object-fit:cover;display:block}

/* ── Éditeur d'avatar ──────────────────────────────────────────── */
.ed-sec{margin:20px 0 0}
.ed-sec:first-of-type{margin-top:4px}
.ed-sec h4{margin:0 0 10px;font-size:12px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--lichen)}
.ed-row{display:flex;gap:10px;flex-wrap:wrap}
.ed-hair{width:58px;height:58px;border-radius:16px;padding:0;overflow:hidden;border:1px solid var(--line);background:rgba(255,255,255,.03);
  transition:border-color var(--dur-1) var(--ease-out),background var(--dur-1) var(--ease-out)}
.ed-hair .avatar-chip{width:100%;height:100%;border:none;border-radius:0}
.ed-hair:hover{border-color:var(--line-2);background:rgba(255,255,255,.06)}
.ed-hair[aria-pressed="true"]{border-color:var(--sprout);background:rgba(104,239,63,.12);box-shadow:0 0 0 3px rgba(104,239,63,.14)}
.ed-face{width:52px;height:52px;border-radius:14px;padding:0;overflow:hidden;border:1px solid var(--line);background:rgba(255,255,255,.03);
  transition:border-color var(--dur-1) var(--ease-out),background var(--dur-1) var(--ease-out)}
.ed-face .avatar-chip{width:100%;height:100%;border:none;border-radius:0}
.ed-face:hover{border-color:var(--line-2);background:rgba(255,255,255,.06)}
.ed-face[aria-pressed="true"]{border-color:var(--sprout);background:rgba(104,239,63,.12);box-shadow:0 0 0 3px rgba(104,239,63,.14)}
.ed-sw{width:44px;height:44px;border-radius:50%;padding:0;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);
  transition:transform var(--dur-1) var(--ease-out),border-color var(--dur-1) var(--ease-out)}
.ed-sw:hover{transform:scale(1.06)}
.ed-sw[aria-pressed="true"]{border-color:var(--sprout);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),0 0 0 3px rgba(104,239,63,.22)}
.ed-preview{display:grid;justify-items:center;gap:12px;padding:6px 0 2px}
.ed-preview .avatar-chip{width:124px;height:124px;border:2px solid rgba(104,239,63,.4)}
.ed-note{font-size:11.5px;line-height:1.5;color:var(--lichen);text-align:center;margin:0;max-width:280px}

/* ── Popup compact (choix d'action) ───────────────────────────── */
.pop{position:fixed;left:50%;top:50%;z-index:60;width:min(330px,calc(100% - 36px));transform:translate(-50%,-46%) scale(.95);
  background:var(--panel);border:1px solid var(--line-2);border-radius:22px;padding:16px;
  opacity:0;pointer-events:none;box-shadow:0 24px 60px rgba(0,0,0,.5);
  transition:opacity var(--dur-2) var(--ease-out),transform var(--dur-2) var(--ease-out)}
.pop.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.pop h3{margin:0 0 4px;font-size:17px;letter-spacing:-.01em}
.pop .psub{margin:0 0 14px;font-size:13px;line-height:1.5;color:var(--fern)}
.pop-opt{display:flex;align-items:center;gap:13px;width:100%;padding:13px;border-radius:15px;text-align:left;
  border:1px solid var(--line);background:rgba(255,255,255,.03);transition:border-color var(--dur-1) var(--ease-out),background var(--dur-1) var(--ease-out)}
.pop-opt + .pop-opt{margin-top:10px}
.pop-opt:hover{border-color:var(--sprout);background:rgba(104,239,63,.09)}
.pop-opt .pi{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;background:rgba(104,239,63,.12);color:var(--sprout);border:1px solid rgba(104,239,63,.24)}
.pop-opt b{display:block;font-size:14.5px;font-weight:600;line-height:1.3}
.pop-opt span{display:block;font-size:12.5px;color:var(--fern);line-height:1.4;margin-top:2px}
.pop-x{margin-top:12px;width:100%;justify-content:center}

/* ── Historique : fil du temps, pas une liste ─────────────────── */
.hist{display:grid;gap:0}
.hist-item{display:flex;align-items:flex-start;gap:13px;padding:13px 14px;border-radius:15px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.hist-item + .hist-item{margin-top:9px}
.hist-ic{width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;background:rgba(104,239,63,.12);color:var(--sprout);border:1px solid rgba(104,239,63,.22)}
.hist-ic.cleaned{background:rgba(242,193,78,.14);color:var(--amber);border-color:rgba(242,193,78,.3)}
.hist-tx{flex:1 1 auto;min-width:0}
.hist-tx b{display:block;font-size:13.5px;font-weight:600;line-height:1.4;letter-spacing:-.005em}
.hist-tx span{display:block;font-size:12px;color:var(--lichen);margin-top:3px;line-height:1.4}
.hist-pt{flex:none;font-size:12.5px;font-weight:700;color:var(--sprout);padding:4px 9px;border-radius:99px;background:rgba(104,239,63,.12);border:1px solid rgba(104,239,63,.24);white-space:nowrap}
.hist-day{font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--lichen);margin:18px 0 9px}
.hist-day:first-child{margin-top:0}
.hist-more{margin-top:12px}
.badge-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.badge-count{font-size:12.5px;color:var(--lichen);font-weight:500}

/* ── Activité : le pied de la grille. Le graphe en barres a laisse la place a la grille de contributions ; seules ces trois regles survivent. ─── */
.wk-foot b{font-family:var(--font-display);font-weight:400;font-size:19px;color:var(--sprout)}
.wk-foot span{font-size:12.5px;color:var(--fern)}

.tl{position:relative;padding-left:30px}
.tl::before{content:"";position:absolute;left:11px;top:14px;bottom:16px;width:2px;border-radius:2px;
  background:linear-gradient(180deg,rgba(104,239,63,.4),rgba(104,239,63,.06))}
.tl-item{position:relative;display:flex;align-items:flex-start;gap:12px;padding:11px 0}
.tl-item + .tl-item{border-top:1px solid var(--line)}
.tl-item .knob{position:absolute;left:-30px;top:10px;width:24px;height:24px;border-radius:50%;
  display:grid;place-items:center;background:var(--forest);border:1px solid rgba(104,239,63,.34);color:var(--sprout)}
.tl-item .knob .ic{width:13px;height:13px}
.tl-item.published .knob{border-color:rgba(242,193,78,.4);color:var(--amber)}
.tl-item.cleaned .knob{background:var(--sprout);border-color:var(--sprout);color:var(--onyx)}
/* Dans une carte, la pastille ne peut pas deborder a gauche : le trait de frise
   n'existe pas la. Elle revient dans le flux, elle garde sa place. */
.card .tl-item .knob{position:static;flex:none;margin-right:2px}
.tl-body{flex:1 1 auto;min-width:0}
.tl-body .tt{display:block;font-size:14px;font-weight:600;line-height:1.4;letter-spacing:-.005em}
.tl-body .tm{display:block;font-size:12px;color:var(--fern);margin-top:3px;line-height:1.4}
.tl-pts{flex:none;font-size:12.5px;font-weight:700;color:var(--sprout);padding:4px 9px;border-radius:99px;
  background:rgba(104,239,63,.12);border:1px solid rgba(104,239,63,.24);white-space:nowrap;margin-top:1px}
.tl-day{font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--lichen);margin:18px 0 0;padding-left:30px}
.tl-day:first-child{margin-top:0;padding-left:0}

.empty{display:grid;justify-items:center;gap:12px;text-align:center;padding:38px 22px;color:var(--fern)}
.empty .ei{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.05);color:var(--lichen)}
.empty b{font-size:15.5px;color:var(--white)}
.empty p{margin:0;font-size:13.5px;max-width:280px;line-height:1.55}

.app-nav{grid-area:nav;border-top:1px solid var(--line);background:rgba(10,21,9,.96);backdrop-filter:blur(14px);padding:8px 10px calc(9px + env(safe-area-inset-bottom))}
.nav-brand,.nav-foot{display:none}
.nav-items{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.navitem{display:grid;justify-items:center;gap:4px;padding:8px 2px 8px;border-radius:12px;color:var(--lichen);font-size:11.5px;font-weight:500;line-height:1.2;transition:color var(--dur-1) var(--ease-out),background var(--dur-1) var(--ease-out);min-height:56px}
.navitem .ic{width:23px;height:23px}
.navitem[aria-current="page"]{color:var(--sprout)}
.navitem:hover{color:var(--white)}
.navitem[aria-current="page"]:hover{color:var(--sprout)}
/* L'appareil photo de l'onglet central : un disque vert qui depasse de la barre.
   C'est l'action du quotidien, elle ne doit pas se confondre avec les onglets
   de navigation — d'ou la taille, le halo, et le debordement vers le haut. */
.navitem.nav-cam{padding-top:2px}
.navitem.nav-cam .ic{width:52px;height:52px;padding:13px;border-radius:50%;
  background:var(--sprout);color:var(--onyx);
  box-shadow:0 0 0 4px rgba(104,239,63,.16),0 0 0 7px rgba(10,21,9,.96),0 8px 20px rgba(0,0,0,.5)}
.navitem.nav-cam:hover .ic{background:oklch(from var(--sprout) calc(l + .07) c h);color:var(--onyx)}
.navitem.nav-cam .ic svg{width:100%;height:100%}
.navitem.nav-cam[aria-current="page"]{color:var(--sprout)}
.navitem.nav-cam[aria-current="page"] .ic{box-shadow:0 0 0 4px rgba(104,239,63,.3),0 0 0 7px rgba(10,21,9,.96),0 8px 20px rgba(0,0,0,.5)}
.nav-brand .mark{width:36px;height:36px;border-radius:12px;background:var(--sprout);color:var(--onyx);display:grid;place-items:center;flex:none}
.nav-brand .word{font-family:var(--font-display);font-weight:400;font-size:20px;letter-spacing:-.01em}
.nav-brand .word b{color:var(--sprout);font-weight:400}
.nav-user{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line)}

.scrim{position:fixed;inset:0;z-index:58;background:rgba(6,12,7,.62);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity var(--dur-2) var(--ease-out)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:59;background:var(--panel);border-top:1px solid var(--line-2);border-radius:26px 26px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(106%);transition:transform var(--dur-3) var(--ease-out);max-height:82%;overflow-y:auto;scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
.sheet.on{transform:translateY(0)}
.grip{width:42px;height:4px;border-radius:99px;background:var(--line-2);margin:2px auto 14px}
.sheet h3{margin:0 0 8px;font-size:18px;letter-spacing:-.01em}

.celebrate{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(6,12,7,.72);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity var(--dur-2) var(--ease-out)}
.celebrate.on{opacity:1;pointer-events:auto}
.celebrate .box{display:grid;justify-items:center;gap:8px;text-align:center;transform:scale(.94);transition:transform var(--dur-3) var(--ease-out);padding:20px}
.celebrate.on .box{transform:scale(1)}
.celebrate .big{font-family:var(--font-display);font-weight:400;font-size:52px;letter-spacing:-.02em;color:var(--sprout);line-height:1}
.celebrate .lbl{font-size:14px;font-weight:600;color:var(--white)}
.celebrate .sub{font-size:13px;color:var(--fern);max-width:280px;line-height:1.5}
.celebrate .rico{width:71px;height:71px;border-radius:50%;display:grid;place-items:center;background:var(--sprout);color:var(--onyx);box-shadow:0 0 0 12px rgba(104,239,63,.14)}
.spark{position:absolute;width:9px;height:9px;border-radius:2px;background:var(--sprout);opacity:0}
.celebrate.on .spark{animation:sparkFly 1s var(--ease-out) forwards}
@keyframes sparkFly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4)}}
.toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:82;display:flex;align-items:center;gap:10px;padding:13px 15px;border-radius:var(--r-sm);background:var(--bone);color:var(--onyx);font-size:13.5px;font-weight:500;box-shadow:0 16px 34px rgba(0,0,0,.4);transform:translateY(160%);transition:transform var(--dur-3) var(--ease-out);pointer-events:none}
.toast.on{transform:translateY(0)}
.toast .ti{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--sprout);color:var(--onyx);flex:none}
.screen-in{animation:screenIn var(--dur-2) var(--ease-out) both}
/* L'appareil photo change de couleur quand on entre dans l'onglet : le petit coup
   de pouce empeche l'oeil de manquer le changement de page. */
@keyframes camPop{0%{transform:scale(1)}38%{transform:scale(1.28)}100%{transform:scale(1)}}
@keyframes screenIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stagger > *{animation:screenIn var(--dur-2) var(--ease-out) both}
.stagger > *:nth-child(1){animation-delay:0ms}
.stagger > *:nth-child(2){animation-delay:35ms}
.stagger > *:nth-child(3){animation-delay:70ms}
.stagger > *:nth-child(4){animation-delay:105ms}
.stagger > *:nth-child(5){animation-delay:140ms}
.stagger > *:nth-child(6){animation-delay:175ms}

@media (hover: none){
  .iconbtn:hover{color:var(--fern);border-color:var(--line)}
  .btn-primary:hover{filter:none}
  .btn-secondary:hover{border-color:var(--line-2);color:var(--white)}
  .btn-light:hover{background:var(--onyx)}
  .rowcard:hover{border-color:var(--line);background:var(--panel)}
  .capture:hover{border-color:var(--line-2);color:var(--fern)}
  .badge:hover{border-color:var(--line)}
  .avatar-opt:hover{border-color:var(--line)}
  .navitem:hover{color:var(--lichen)}
  .navitem[aria-current="page"]:hover{color:var(--sprout)}
}
@media (min-width:1024px){
  #app{grid-template-columns:266px minmax(0,1fr);grid-template-rows:100dvh;grid-template-areas:"nav main"}
  .app-nav{display:flex;flex-direction:column;border-top:none;border-right:1px solid var(--line);background:var(--forest-2);backdrop-filter:none;padding:22px 16px}
  .nav-brand{display:flex;align-items:center;gap:10px;padding:2px 6px 22px}
  .nav-items{display:flex;flex-direction:column;gap:4px}
  .navitem{display:flex;flex-direction:row;justify-content:flex-start;align-items:center;gap:12px;padding:12px 14px;font-size:14.5px;border-radius:14px;min-height:48px}
  .navitem .ic{width:22px;height:22px}
  .navitem[aria-current="page"]{background:rgba(104,239,63,.12)}
  /* Sur ordinateur la colonne de gauche est une vraie liste d'onglets : le disque
     camera n'est pas sureleve, mais il garde son fond vert pour rester l'icone de
     l'app — seule sa taille revient dans le gabarit des autres. Actif, il passe en
     blanc, ce qui dit ou l'on est sans lire le libelle. */
  .navitem.nav-cam{padding:12px 14px}
  .navitem.nav-cam .ic{width:24px;height:24px;padding:6px;border-radius:50%;
    background:var(--sprout);color:var(--onyx);box-shadow:none;
    transition:background var(--dur-1) var(--ease-out)}
  .navitem.nav-cam:hover .ic{background:oklch(from var(--sprout) calc(l + .07) c h);color:var(--onyx)}
  .navitem.nav-cam[aria-current="page"] .ic{background:var(--white);color:var(--onyx);box-shadow:none;animation:camPop var(--dur-3) var(--ease-out)}
  .navitem.nav-cam[aria-current="page"]{color:var(--sprout)}
  .nav-foot{display:grid;gap:10px;margin-top:auto;padding-top:16px}
  .sbar{position:static;max-width:920px;margin:0 auto;padding:28px 32px 4px;background:none;backdrop-filter:none}
  .pad{max-width:920px;margin:0 auto;padding:6px 32px 48px}
  .statstrip{gap:14px}
  .sheet{left:50%;right:auto;bottom:28px;width:min(480px,92vw);transform:translate(-50%,130%);border-radius:22px;border:1px solid var(--line-2);padding:14px 18px 18px}
  .sheet.on{transform:translate(-50%,0)}
  .toast{left:50%;right:auto;width:min(430px,90vw);transform:translate(-50%,180%)}
  .toast.on{transform:translate(-50%,0)}
}
@media (min-width:1440px){
  #app{grid-template-columns:288px minmax(0,1fr)}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  .you::after{display:none}
}
/* ── Signalement rouge : organisation competente ─────────────────── */
.badge-red{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:var(--r-pill);
  font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  background:rgba(255,116,82,.14);color:var(--danger);border:1px solid rgba(255,116,82,.32)}
.row-red{border-color:rgba(255,116,82,.22)}
.row-red:hover{border-color:rgba(255,116,82,.42)}
.alert-red{display:flex;gap:13px;align-items:flex-start;padding:15px 16px;border-radius:var(--r-card);
  background:rgba(255,116,82,.09);border:1px solid rgba(255,116,82,.28)}
.alert-red .ai{flex:none;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;
  background:rgba(255,116,82,.16);color:var(--danger)}
.alert-red b{display:block;font-size:13.5px;margin-bottom:3px}
.alert-red .ls{display:block;font-size:12.5px;line-height:1.55;color:var(--fern)}
.alert-red .ls b{color:var(--mist);display:inline;font-size:12.5px;margin:0}

/* ── Assistant : bouton flottant + panneau ────────────────────────────
   Le panneau est un calque, pas un ecran de plus : l'application reste visible
   derriere, ce qui evite de se perdre. Le halo vert ne couvre que le bas de
   l'ecran, en degrade vers le noir — jamais la page entiere. */
.fab-assistant{
  position:fixed;right:18px;z-index:44;
  bottom:calc(78px + env(safe-area-inset-bottom));
  width:58px;height:58px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 32% 28%,var(--sprout-2),var(--sprout) 46%,var(--verdant) 100%);
  color:#0b160c;box-shadow:0 10px 26px rgba(0,0,0,.5),0 0 0 1px rgba(104,239,63,.34),0 0 0 8px rgba(104,239,63,.07);
  animation:assGlow 4.2s var(--ease-out) infinite;
  transition:transform var(--dur-2) var(--ease-out)}
.fab-assistant:hover{transform:translateY(-2px) scale(1.03)}
.fab-assistant:active{transform:scale(.95)}
.fab-assistant .ic{width:26px;height:26px;stroke-width:2}
@keyframes assGlow{
  0%,100%{box-shadow:0 10px 26px rgba(0,0,0,.5),0 0 0 1px rgba(104,239,63,.34),0 0 0 6px rgba(104,239,63,.06)}
  50%{box-shadow:0 10px 26px rgba(0,0,0,.5),0 0 0 1px rgba(104,239,63,.5),0 0 0 13px rgba(104,239,63,0)}}
.fab-assistant .fab-badge{
  position:absolute;top:-2px;right:-2px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;
  background:var(--danger);color:#1a0905;font-size:10.5px;font-weight:700;display:grid;place-items:center;
  border:2px solid var(--forest);font-family:var(--font-ui)}

#assistant{position:fixed;inset:0;z-index:60;display:none}
#assistant.on{display:block}
/* Le voile n'assombrit plus la page. C'est le panneau qui monte en degrade vers
   le haut : la zone superieure reste a opacity 0, donc l'application — son
   titre, son serie, sa navigation — se continue de lire derriere. */
.as-scrim{position:absolute;inset:0;opacity:0;transition:opacity var(--dur-2) var(--ease-out)}
#assistant.on .as-scrim{opacity:1}
.as-panel{
  position:absolute;inset:0;display:flex;flex-direction:column;
  padding:calc(104px + env(safe-area-inset-top)) 0 env(safe-area-inset-bottom);
  background:linear-gradient(to bottom,
    rgba(8,15,9,0) 0%, rgba(8,15,9,0) 15%,
    rgba(9,18,10,.58) 30%, rgba(10,21,11,.93) 46%, #0a1409 100%);
  transform:translateY(26px);opacity:0;
  transition:transform var(--dur-3) var(--ease-out),opacity var(--dur-3) var(--ease-out)}
#assistant.on .as-panel{transform:none;opacity:1}
.as-panel::before{content:"";position:absolute;left:0;right:0;top:0;height:132px;pointer-events:none;
  background:linear-gradient(to bottom,rgba(104,239,63,.13),rgba(104,239,63,0))}
.as-panel::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(130% 52% at 50% 100%,rgba(104,239,63,.13),rgba(104,239,63,0) 72%)}
.as-grip{display:none}
.as-head{display:flex;align-items:center;gap:12px;padding:0 18px 14px;position:relative;z-index:1}
.as-av{position:relative;flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 32% 28%,var(--sprout-2),var(--verdant));color:#0b160c}
.as-av::after{content:"";position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;
  background:var(--sprout);border:2.5px solid #0d1a10}
.as-who{flex:1;min-width:0}
.as-who b{display:block;font-size:15px;letter-spacing:-.01em}
.as-who span{display:block;font-size:11.5px;color:var(--fern)}
.as-log{flex:1 1 auto;min-height:0;overflow-y:auto;padding:4px 18px 18px;display:flex;flex-direction:column;gap:14px;position:relative;z-index:1}
.msg{max-width:86%;padding:12px 14px;border-radius:18px;font-size:14px;line-height:1.55;animation:msgIn var(--dur-2) var(--ease-out) both}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.bot{align-self:flex-start;background:var(--panel-2);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.me{align-self:flex-end;background:linear-gradient(140deg,var(--sprout),var(--verdant));color:#0b160c;font-weight:500;border-bottom-right-radius:6px}
.msg b{font-weight:600}
.msg .ml{display:block;margin-top:7px;font-size:13.5px}
.msg img{border-radius:11px;max-width:190px;display:block;margin-top:8px;border:1px solid var(--line)}
/* Un message qui contient une action : une carte, pas du texte melange. */
.msg-card{align-self:stretch;max-width:100%;background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r-card);padding:14px}
.msg-card h4{margin:0 0 4px;font-size:13.5px;letter-spacing:.02em;text-transform:uppercase;color:var(--sprout);font-weight:600}
.msg-card .mc-sub{font-size:12.5px;color:var(--fern);margin-bottom:11px}
.msg-card .mc-line{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.msg-card .mc-line:first-of-type{border-top:0}
.msg-card .mc-line .od-fill{min-width:0}
.msg-card .mc-line b{display:block;font-weight:600}
.msg-card .mc-line span{font-size:12px;color:var(--fern)}
.msg-card .mc-line .gain{margin-left:auto;flex:none;font-size:12px;color:var(--sprout);font-weight:600}
/* Les propositions de reponse : cliquables, jamais un champ de texte vide. */
.as-opts{display:flex;flex-wrap:wrap;gap:9px;padding:2px 18px 14px;position:relative;z-index:1}
.as-opt{
  min-height:44px;padding:10px 15px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line-2);
  color:var(--bone);font-size:13.5px;font-weight:500;text-align:left;display:inline-flex;align-items:center;gap:8px;
  transition:background var(--dur-1) var(--ease-out),border-color var(--dur-1) var(--ease-out)}
.as-opt:hover{background:#27422b;border-color:rgba(104,239,63,.5)}
.as-opt .ic{color:var(--sprout)}
.as-opt.go{background:linear-gradient(140deg,var(--sprout),var(--verdant));color:#0b160c;border-color:transparent;font-weight:600}
.as-opt.go .ic{color:#0b160c}
.as-opt.go:hover{filter:brightness(1.08)}
.as-opt[disabled]{opacity:.5;pointer-events:none}
.as-bar{display:flex;align-items:center;gap:9px;padding:11px 18px 14px;border-top:1px solid var(--line);position:relative;z-index:1;background:rgba(8,15,9,.92)}
.as-bar .input{flex:1;min-height:44px}
.as-send{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--sprout),var(--verdant));color:#0b160c;
  transition:filter var(--dur-1) var(--ease-out),transform var(--dur-1) var(--ease-out)}
.as-send:hover{filter:brightness(1.09)}
.as-send:active{transform:scale(.94)}
.as-note{position:relative;z-index:1;font-size:11px;color:var(--lichen);text-align:center;padding:0 18px 10px}
/* Le separateur « donnee lue dans l app », pour ne pas confondre ce que
   l assistant lit avec ce qu il invente. */
.msg-src{display:block;margin-top:8px;font-size:11px;color:var(--lichen);display:flex;align-items:center;gap:5px}
@media (min-width:921px){
  .as-panel{inset:auto;left:50%;top:50%;transform:translate(-50%,-46%) scale(.97);
    width:min(620px,92vw);height:min(780px,88dvh);padding:0 0 18px;border-radius:26px;
    border:1px solid rgba(104,239,63,.26);overflow:hidden;
    background:linear-gradient(to bottom,rgba(8,15,9,.9) 0%,rgba(10,21,11,.97) 22%,#0a1409 100%);
    box-shadow:0 30px 90px rgba(0,0,0,.6)}
  #assistant.on .as-panel{transform:translate(-50%,-50%)}
  .as-panel::before{height:96px}
  .fab-assistant{bottom:26px;right:26px}
}
@media (prefers-reduced-motion:reduce){
  .fab-assistant{animation:none}
  .msg{animation:none}
}


/* ── Bilan d'impact : la carte que l on emporte et partage ──────────
   Le poster exporte est redessine sur un canvas avec les memes valeurs,
   donc l image et l ecran ne peuvent pas diverger. */
.imp-card{position:relative;overflow:hidden;padding:28px 22px 22px;border-radius:26px;
  background:linear-gradient(158deg,#1d3524 0%,#122314 52%,#0c1a0e 100%);
  border:1px solid rgba(104,239,63,.3);text-align:center}
.imp-card::before{content:"";position:absolute;right:-72px;top:-92px;width:232px;height:232px;border-radius:50%;
  background:radial-gradient(circle at 42% 42%,rgba(104,239,63,.32),rgba(38,162,0,.05) 62%,transparent 70%);pointer-events:none}
.imp-card::after{content:"";position:absolute;left:22px;right:22px;bottom:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(104,239,63,.35),transparent)}
.imp-top{display:grid;justify-items:center;gap:9px;position:relative;z-index:1}
.imp-av{width:96px;height:96px;border-radius:50%;overflow:hidden;border:2px solid rgba(104,239,63,.45);
  box-shadow:0 0 0 6px rgba(104,239,63,.08)}
.imp-av svg,.imp-av img{width:100%;height:100%;display:block}
.imp-name{font-family:var(--font-display);font-weight:400;font-size:20px;line-height:1.2;margin:2px 0 0}
.imp-lvl{font-size:12.5px;color:var(--sprout);letter-spacing:.02em}
.imp-pts{font-family:var(--font-display);font-weight:400;font-size:54px;line-height:1;margin-top:8px}
.imp-pts small{font-family:var(--font-ui);font-size:13px;font-weight:600;color:var(--fern);margin-left:7px;letter-spacing:.08em}
.imp-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.imp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:20px;
  background:rgba(255,255,255,.09);border-radius:16px;overflow:hidden;position:relative;z-index:1}
.imp-cell{background:#122314;padding:13px 8px 14px;text-align:center}
.imp-cell b{display:block;font-family:var(--font-display);font-weight:400;font-size:19px;line-height:1.1}
.imp-cell span{display:block;font-size:11px;color:var(--lichen);margin-top:5px;line-height:1.35}
.imp-mark{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:7px;
  margin-top:18px;font-size:11.5px;color:var(--lichen)}
.imp-mark .mk{width:22px;height:22px;border-radius:7px;background:var(--sprout);color:var(--onyx);display:grid;place-items:center}
.imp-bars{display:grid;gap:12px}
.imp-bar{display:grid;grid-template-columns:104px 1fr 30px;align-items:center;gap:12px;font-size:12.5px;color:var(--fern)}
.imp-bar .ib-track{height:8px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}
.imp-bar .ib-track i{display:block;height:100%;border-radius:99px}
.imp-bar .ib-n{text-align:right;font-family:var(--font-mono);font-size:12px;color:var(--white)}
.imp-busy{display:flex;align-items:center;gap:10px;justify-content:center;font-size:13px;color:var(--fern);padding:4px 0}
.imp-spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(104,239,63,.25);border-top-color:var(--sprout);animation:spin .7s linear infinite}

/* ── Parcours d'entrée : splash → onboarding → compte ───────────────
   Un voile plein ecran au-dessus de l'app, qui ne s'affiche qu'a la
   premiere ouverture. Chaque etape respire : une seule idee, un seul
   bouton primaire, aucune comparaison a evaluer. */
#entry{position:fixed;inset:0;z-index:80;display:none;background:var(--forest-3)}
#entry.on{display:block}
#entry.ed{background:var(--forest-2)}
.en{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.en.on{display:flex}

/* Splash : la marque respire, rien d'autre. */
.en-splash{position:absolute;inset:0;align-items:center;justify-content:center;flex-direction:column;gap:0;
  background:radial-gradient(120% 78% at 50% 42%,#16301d,#080f09 78%)}
.sp-mark{width:82px;height:82px;border-radius:24px;display:grid;place-items:center;color:#0b160c;
  background:linear-gradient(140deg,var(--sprout),var(--verdant));
  box-shadow:0 20px 60px rgba(104,239,63,.3);animation:spIn .6s var(--ease-out) both}
.sp-mark .ic{width:42px;height:42px;stroke-width:2}
@keyframes spIn{from{opacity:0;transform:scale(.7) rotate(-8deg)}to{opacity:1;transform:none}}
.sp-word{margin-top:22px;font-family:var(--font-display);font-size:31px;letter-spacing:-.02em;animation:spIn .6s .1s var(--ease-out) both}
.sp-word b{color:var(--sprout);font-weight:inherit}
.sp-tag{margin-top:9px;font-size:14px;color:var(--fern);animation:spIn .6s .18s var(--ease-out) both}
.sp-bar{margin-top:30px;width:104px;height:3px;border-radius:99px;background:rgba(242,245,235,.1);overflow:hidden}
.sp-bar i{display:block;height:100%;width:40%;border-radius:99px;background:linear-gradient(90deg,var(--verdant),var(--sprout));
  animation:spBar 1.15s var(--ease-out) infinite}
@keyframes spBar{from{transform:translateX(-110%)}to{transform:translateX(320%)}}

/* Ossature commune des etapes. */
.en-top{display:flex;align-items:center;gap:10px;padding:calc(20px + env(safe-area-inset-top)) 20px 0;flex:none}
.en-dots{display:flex;gap:6px;margin-left:auto}
.en-dots i{width:6px;height:6px;border-radius:99px;background:rgba(242,245,235,.16);transition:background var(--dur-2),width var(--dur-2)}
.en-dots i.on{width:20px;background:var(--sprout)}
.en-step{counter-increment:en;position:absolute;top:calc(22px + env(safe-area-inset-top));right:20px;
  font-family:var(--font-ui);font-size:11px;letter-spacing:.08em;color:var(--lichen)}
.en-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:30px 24px 8px;display:flex;flex-direction:column;
  animation:enIn .34s var(--ease-out) both;scrollbar-width:none}
.en-body::-webkit-scrollbar{display:none}
@keyframes enIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.en-body h2{font-family:var(--font-display);font-size:27px;line-height:1.2;letter-spacing:-.02em;margin:0}
.en-lead{margin-top:11px;font-size:15px;line-height:1.6;color:var(--fern);max-width:34ch}
.en-foot{flex:none;padding:16px 24px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;
  background:linear-gradient(to top,var(--forest-3) 62%,rgba(10,21,11,0))}

/* Onboarding : une idee, une illustration, un texte. */
/* flex:none car le corps est un flex vertical : sans cela l'illustration
   est ecrasee par le titre et les faits, et se retrouve a 2 px. */
.ob-art{flex:none;height:150px;border-radius:22px;margin-bottom:30px;display:grid;place-items:center;position:relative;overflow:hidden;
  background:linear-gradient(150deg,#1c3a24,#0d1a11);border:1px solid var(--line-2)}
.ob-art::after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;
  background:radial-gradient(circle,rgba(104,239,63,.2),rgba(104,239,63,0) 68%)}
.ob-art .ic{width:64px;height:64px;stroke-width:1.5;color:var(--sprout);position:relative}
.ob-facts{display:flex;flex-direction:column;gap:2px;margin-top:26px}
.ob-fact{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.ob-fact:first-child{border-top:0}
.ob-fact .ofi{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
  background:rgba(104,239,63,.12);color:var(--sprout)}
.ob-fact .ofi .ic{width:17px;height:17px;stroke-width:2}
.ob-fact b{display:block;font-size:14.5px;font-weight:600}
.ob-fact span{display:block;margin-top:2px;font-size:13px;line-height:1.5;color:var(--fern)}

/* Choix binaire : deux lignes, pas deux cartes a comparer. */
.en-pick{display:flex;flex-direction:column;gap:12px;margin-top:32px}
.en-pickbtn{display:flex;align-items:center;gap:14px;min-height:64px;padding:14px 16px;text-align:left;
  background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r-card);color:var(--bone);
  transition:background var(--dur-1),border-color var(--dur-1)}
.en-pickbtn:hover{background:#1a2c1e;border-color:rgba(104,239,63,.4)}
.en-pickbtn .epi{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:var(--panel-2);color:var(--sprout)}
.en-pickbtn .epi .ic{width:19px;height:19px;stroke-width:2}
.en-pickbtn b{display:block;font-size:15px}
.en-pickbtn span{display:block;margin-top:2px;font-size:12.5px;color:var(--fern)}
.en-pickbtn.primary{background:linear-gradient(140deg,var(--sprout),var(--verdant));border-color:transparent;color:#0b160c}
.en-pickbtn.primary .epi{background:rgba(11,22,12,.16);color:#0b160c}
.en-pickbtn.primary span{color:rgba(11,22,12,.72)}

/* Formulaire : un groupe par bloc, 26 px entre les champs. */
.en-form{display:flex;flex-direction:column;gap:26px;margin-top:30px}
