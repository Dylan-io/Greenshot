const en = { step:0, mode:'onboarding', data:{ nom:'', email:'', tel:'', pays:'+257', mdp:'' }, handle:'', av:'camille', photo:null, err:{} };

function enSaved(){ try { return localStorage.getItem(EN_KEY) === 'done'; } catch(e){ return false; } }
function enMarkDone(){ try { localStorage.setItem(EN_KEY, 'done'); } catch(e){} }
function enReset(){ try { localStorage.removeItem(EN_KEY); } catch(e){} }

function slugify(s){
  return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9]+/g,'').slice(0,14);
}
/* Les pseudos déjà pris : les joueurs du classement. Un vrai serveur
   répondrait « pseudo disponible » ; ici la liste est locale et honnête. */
function enTaken(){
  return SEED_BOARD.map(p => slugify(p.name.split(' ')[0] + (p.name.split(' ')[1] || '')));
}
function enHandle(base){
  const b = slugify(base) || 'eclaireur';
  const taken = enTaken();
  if (taken.indexOf(b) < 0) return b;
  for (let i = 2; i < 40; i++) if (taken.indexOf(b + i) < 0) return b + i;
  return b + Date.now().toString().slice(-3);
}
function enAltHandles(){
  const b = slugify(en.data.nom) || 'eclaireur';
  return [b + '_bi', b + '.bi', b + '2026'].filter((v, i, a) => a.indexOf(v) === i && v !== en.handle);
}
const PAYSL = [
  { code:'+257', name:'Burundi' }, { code:'+250', name:'Rwanda' }, { code:'+255', name:'Tanzanie' },
  { code:'+256', name:'Ouganda' }, { code:'+225', name:'Côte d’Ivoire' }, { code:'+33', name:'France' }
];
function enTelOk(v){ return /^[0-9]{6,10}$/.test(String(v).replace(/\s/g,'')); }
function enEmailOk(v){ return /^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(String(v)); }
function enMdpOk(v){ return String(v).length >= 8 && /[0-9]/.test(v) && /[a-zA-Zà-ÿ]/.test(v); }

function enValidate(){
  const e = {}, d = en.data;
  if (d.nom.trim().length < 2) e.nom = 'Indiquez votre nom complet.';
  if (!enEmailOk(d.email)) e.email = 'Adresse e-mail invalide.';
  if (!enTelOk(d.tel)) e.tel = 'Entrez 6 à 10 chiffres.';
  if (!enMdpOk(d.mdp)) e.mdp = '8 caractères minimum, avec un chiffre et une lettre.';
  en.err = e;
  return Object.keys(e).length === 0;
}
function enField(key, label, lead, extra){
  const d = en.data, bad = en.err[key];
  return '<div class="en-field' + (bad ? ' err' : '') + '"><label for="en-' + key + '">' + label + '</label>' +
    '<div class="en-inwrap"><span class="ic-lead">' + ic(lead) + '</span>' +
    '<input id="en-' + key + '" type="' + (key === 'email' ? 'email' : key === 'mdp' ? 'password' : key === 'tel' ? 'tel' : 'text') + '"' +
      (key === 'mdp' ? ' data-eye="enEye"' : '') + ' value="' + esc(d[key]) + '" placeholder="' + extra + '"' +
      ' autocomplete="' + (key === 'email' ? 'email' : key === 'mdp' ? 'new-password' : key === 'tel' ? 'tel' : 'name') + '"' +
      (bad ? ' aria-invalid="true"' : '') + ' aria-describedby="enm-' + key + '"></div>' +
    (key === 'mdp' ? '<button class="en-eye" id="enEye" type="button" aria-label="Afficher le mot de passe">' + ic('eye') + '</button>' : '') +
    '<p class="en-msg" id="enm-' + key + '">' + (bad || '') + '</p></div>';
}
function enTop(label){
  const dots = (label === 'onboarding')
    ? '<div class="en-dots">' + ONBOARD.map((_, i) => '<i' + (i === en.step ? ' class="on"' : '') + '></i>').join('') + '</div>' : '';
  return '<div class="en-top">' +
    (en.step > 0 && label === 'onboarding' ? '<button class="iconbtn" id="enPrev" type="button" aria-label="Étape précédente">' + ic('chevL') + '</button>' : '') +
    '<div class="en-step">' + (en.step + 1) + ' / ' + (label === 'onboarding' ? ONBOARD.length : 5) + '</div>' + dots + '</div>';
}
function enBodyOnboarding(){
  const s = ONBOARD[en.step];
  return enTop('onboarding') +
  '<div class="en-body"><div class="ob-art">' + ic(s.icon) + '</div>' +
    '<h2 data-od-id="entry-titre">' + s.title + '</h2><p class="en-lead">' + s.lead + '</p>' +
    '<div class="ob-facts">' + s.facts.map(f =>
      '<div class="ob-fact"><span class="ofi">' + ic(f.icon) + '</span>' +
      '<span class="od-fill"><b>' + f.b + '</b><span>' + f.s + '</span></span></div>').join('') + '</div>' +
  '</div>' +
  '<div class="en-foot">' +
    '<button class="btn btn-primary btn-block" id="enNext" data-od-id="entry-suivant">' + ic('chev','sm') +
      (en.step === ONBOARD.length - 1 ? 'Créer mon compte' : 'Continuer') + '</button>' +
    '<button class="btn btn-ghost btn-block" id="enSkip" type="button" data-od-id="entry-passer">Passer la présentation</button>' +
  '</div>';
}
function enBodyChoix(){
  return enTop('choix') +
  '<div class="en-body"><h2 data-od-id="entry-titre">Votre compte Greenshot</h2>' +
    '<p class="en-lead">Votre profil, vos points et votre classement sont liés à ce compte. Un compte, un historique, sur tous vos appareils.</p>' +
    '<div class="en-pick">' +
      '<button class="en-pickbtn primary" id="enSignup" data-od-id="entry-creer">' +
        '<span class="epi">' + ic('plus') + '</span><span class="od-fill"><b>Créer un compte</b><span>30 secondes, avec votre avatar</span></span></button>' +
      '<button class="en-pickbtn" id="enLogin" data-od-id="entry-connecter">' +
        '<span class="epi">' + ic('user') + '</span><span class="od-fill"><b>J’ai déjà un compte</b><span>Se connecter avec mon e-mail</span></span></button>' +
    '</div>' +
  '</div>' +
  '<div class="en-foot"><button class="btn btn-ghost btn-block" id="enBack0" type="button">Retour</button></div>';
}
function enBodySignup(){
  const d = en.data;
  return enTop('signup') +
  '<div class="en-body"><h2 data-od-id="entry-titre">Créer votre compte</h2>' +
    '<p class="en-lead">Ces informations restent sur cet appareil dans cette démonstration.</p>' +
    '<div class="en-form">' +
      enField('nom', 'Nom complet', 'user', 'Ex. Camille Mukamana') +
      enField('email', 'Adresse e-mail', 'mail', 'vous@exemple.bi') +
      '<div class="en-field"><label for="en-tel">Téléphone</label><div class="en-phone">' +
        '<button class="en-pref" id="enPays" type="button" aria-label="Indicatif du pays, ' + esc(en.data.pays) + '">' +
          en.data.pays + ic('chev') + '</button>' +
        '<div class="en-inwrap" style="flex:1"><span class="ic-lead">' + ic('phone') + '</span>' +
        '<input id="en-tel" type="tel" inputmode="tel" value="' + esc(d.tel) + '" placeholder="79 12 345"' +
          (en.err.tel ? ' aria-invalid="true"' : '') + '></div></div>' +
        '<p class="en-msg" id="enm-tel">' + (en.err.tel || '') + '</p></div>' +
      enField('mdp', 'Mot de passe', 'lock', '8 caractères minimum') +
    '</div></div>' +
  '<div class="en-foot">' +
    '<button class="btn btn-primary btn-block" id="enSubmit" data-od-id="entry-valider">Continuer</button>' +
    '<button class="btn btn-ghost btn-block" id="enBack1" type="button">Retour</button></div>';
}
function enBodyLogin(){
  return enTop('login') +
  '<div class="en-body"><h2 data-od-id="entry-titre">Connexion</h2>' +
    '<p class="en-lead">Entrez l’adresse associée à votre compte Greenshot.</p>' +
    '<div class="en-form">' + enField('email', 'Adresse e-mail', 'mail', 'vous@exemple.bi') +
    enField('mdp', 'Mot de passe', 'lock', 'Votre mot de passe') + '</div></div>' +
  '<div class="en-foot">' +
    '<button class="btn btn-primary btn-block" id="enSubmitLogin" data-od-id="entry-valider-connexion">Se connecter</button>' +
    '<button class="btn btn-ghost btn-block" id="enBack2" type="button">Retour</button></div>';
}
function enBodyHandle(){
  return enTop('handle') +
  '<div class="en-body"><h2 data-od-id="entry-titre">Votre nom d’utilisateur</h2>' +
    '<p class="en-lead">Il apparaît sur le classement et sur vos signalements. Modifiable à tout moment depuis le profil.</p>' +
    '<div class="en-handle"><span>@</span><input id="enHandle" value="' + esc(en.handle) + '" aria-label="Nom d’utilisateur" autocomplete="off"></div>' +
    '<p class="en-ok" id="enHandleOk">' + ic('check') + 'Disponible</p>' +
    '<div class="en-alts">' + enAltHandles().map(h => '<button class="en-alt" data-alt="' + h + '">@' + h + '</button>').join('') + '</div>' +
  '</div>' +
  '<div class="en-foot">' +
    '<button class="btn btn-primary btn-block" id="enSubmitHandle" data-od-id="entry-valider-pseudo">Choisir cet avatar</button></div>';
}
function enBodyAvatar(){
  return enTop('avatar') +
  '<div class="en-body"><h2 data-od-id="entry-titre">Votre avatar</h2>' +
    '<p class="en-lead">Un avatar est créé automatiquement à l’inscription. Vous pourrez le changer, ou ajouter une photo, depuis votre profil.</p>' +
    '<div class="en-avprev"><span class="apv">' +
      (en.photo ? '<img src="' + en.photo + '" alt="Votre photo de profil">' : '<img src="assets/avatars/avatar-' + en.av + '.svg" alt="Avatar ' + en.av + '">') +
      '<span class="lvl">1</span></span>' +
      '<span class="od-fill"><b>' + (en.photo ? 'Photo de profil' : 'Avatar Greenshot') + '</b>' +
      '<span style="display:block;margin-top:4px;font-size:12.5px;line-height:1.45;color:var(--fern)">' + (en.photo ? 'Elle n’est pas envoyée à un serveur' : 'Dessiné dans vos couleurs, aucun réseau') + '</span></span>' +
      '<label class="en-photo" for="enPhoto">' + ic('camera') + 'Photo</label>' +
      '<input id="enPhoto" type="file" accept="image/*" hidden></div>' +
    '<div class="en-avgrid">' + AV_CHOICES.map(a =>
      '<button class="en-avbtn" data-av="' + a + '" aria-pressed="' + (a === en.av && !en.photo) + '" aria-label="Avatar ' + a + '">' +
      '<img src="assets/avatars/avatar-' + a + '.svg" alt=""></button>').join('') + '</div>' +
  '</div>' +
  '<div class="en-foot">' +
    '<button class="btn btn-primary btn-block" id="enSubmitAvatar" data-od-id="entry-terminer">Entrer dans Greenshot</button>' +
    '<button class="btn btn-ghost btn-block" id="enBack3" type="button">Retour</button></div>';
}

const EN_SCREENS = { onboarding:enBodyOnboarding, choix:enBodyChoix, signup:enBodySignup, login:enBodyLogin, handle:enBodyHandle, avatar:enBodyAvatar };

function enShow(step, mode){
  if (mode) en.mode = mode;
  en.step = step;
  const root = document.getElementById('entry');
  root.classList.add('on', 'ed');
  document.body.style.overflow = 'hidden';
  const scr = document.createElement('div');
  scr.className = 'en on';
  scr.innerHTML = EN_SCREENS[en.mode]();
  root.innerHTML = '';
  root.appendChild(scr);
  enBind();
  const f = scr.querySelector('input');
  if (f && en.mode === 'handle') f.focus();
}
function enClose(){
  const root = document.getElementById('entry');
  root.classList.remove('on');
  root.innerHTML = '';
  document.body.style.overflow = '';
  enMarkDone();
  render();
}
function enGo(step, mode){ enShow(step, mode); }

function enBind(){
  const g = id => document.getElementById(id);
  const setErr = (key, msg) => {
    const f = g('en-' + key); if (!f) return;
    f.closest('.en-field').classList.toggle('err', !!msg);
    const m = g('enm-' + key); if (m) m.textContent = msg || '';
  };
  /* Saisie : on ne valide le champ qu'après une première tentative. */
  ['nom','email','tel','mdp'].forEach(k => {
    const f = g('en-' + k); if (!f) return;
    f.addEventListener('input', () => {
      en.data[k] = f.value;
      if (en.err[k]) setErr(k, enValidate() || en.err[k] === undefined ? '' : en.err[k]);
      if (k === 'nom' && !en.touchedHandle){ en.handle = enHandle(f.value); const h = g('enHandle'); if (h) h.value = en.handle; }
    });
  });
  const eye = g('enEye');
  if (eye) eye.addEventListener('click', () => {
    const f = g('en-mdp'), on = f.type === 'password';
    f.type = on ? 'text' : 'password';
    eye.setAttribute('aria-label', on ? 'Masquer le mot de passe' : 'Afficher le mot de passe');
  });
  const pays = g('enPays');
  if (pays) pays.addEventListener('click', () => {
    const i = PAYSL.findIndex(p => p.code === en.data.pays);
    const p = PAYSL[(i + 1) % PAYSL.length];
    en.data.pays = p.code;
    pays.childNodes[0].nodeValue = p.code + ' ';
    pays.setAttribute('aria-label', 'Indicatif du pays, ' + p.code + ' ' + p.name);
  });
  const prev = g('enPrev');
  if (prev) prev.addEventListener('click', () => enShow(Math.max(0, en.step - 1), 'onboarding'));
  const next = g('enNext');
  if (next) next.addEventListener('click', () => enShow(en.step + 1, 'onboarding'));
  const skip = g('enSkip');
  if (skip) skip.addEventListener('click', () => enShow(0, 'choix'));
  g('enBack0') && g('enBack0').addEventListener('click', () => enShow(ONBOARD.length - 1, 'onboarding'));
  g('enBack1') && g('enBack1').addEventListener('click', () => enShow(0, 'choix'));
  g('enBack2') && g('enBack2').addEventListener('click', () => enShow(0, 'choix'));
  g('enBack3') && g('enBack3').addEventListener('click', () => enShow(4, 'handle'));
  g('enSignup') && g('enSignup').addEventListener('click', () => enShow(0, 'signup'));
  g('enLogin') && g('enLogin').addEventListener('click', () => enShow(0, 'login'));
  /* setErr(cle, message) : on passe la cle et son message explicitement.
     Un forEach nu enverrait l'index comme second argument, et le champ
     afficherait « 1 », « 2 », « 3 » au lieu du texte d'erreur. */
  const paintErr = () => Object.keys(en.err).forEach(k => setErr(k, en.err[k]));
  const submit = g('enSubmit');
  if (submit) submit.addEventListener('click', () => {
    enValidate();
    /* Les messages doivent etre ecrits dans le DOM : sans cela la
       validation est calculee puis jetee, et le formulaire parait inerte. */
    paintErr();
    const keys = Object.keys(en.err);
    if (keys.length){ const f = g('en-' + keys[0]); if (f) f.focus(); return; }
    enShow(0, 'handle');
  });
  const submitLogin = g('enSubmitLogin');
  if (submitLogin) submitLogin.addEventListener('click', () => {
    en.err = {};
    if (!enEmailOk(en.data.email)) en.err.email = 'Adresse e-mail invalide.';
    if (String(en.data.mdp).length < 8) en.err.mdp = 'Mot de passe trop court.';
    paintErr();
    if (Object.keys(en.err).length){ const f = g('en-' + Object.keys(en.err)[0]); if (f) f.focus(); return; }
    enShow(0, 'avatar');
  });
  const h = g('enHandle');
  if (h) h.addEventListener('input', () => {
    en.touchedHandle = true;
    en.handle = h.value.toLowerCase().replace(/[^a-z0-9_.]/g,'');
    h.value = en.handle;
    const taken = enTaken().indexOf(en.handle) > -1;
    const bad = en.handle.length < 3 || taken;
    const msg = g('enHandleOk');
    msg.classList.toggle('taken', bad);
    msg.innerHTML = ic(bad ? 'close' : 'check')
      + (en.handle.length < 3 ? 'Au moins 3 caractères' : taken ? 'Déjà pris' : 'Disponible');
    g('enSubmitHandle').disabled = bad;
  });
  document.querySelectorAll('[data-alt]').forEach(b => b.addEventListener('click', () => {
    en.handle = b.getAttribute('data-alt'); h.value = en.handle; h.dispatchEvent(new Event('input'));
  }));
  g('enSubmitHandle') && g('enSubmitHandle').addEventListener('click', () => { en.photo = null; enShow(0, 'avatar'); });
  const ph = g('enPhoto');
  if (ph) ph.addEventListener('change', () => {
    const f = ph.files && ph.files[0]; if (!f) return;
    if (f.size > 2.2e6){ toast('Image trop lourde (2 Mo maximum)'); return; }
    const rd = new FileReader();
    rd.onload = () => { en.photo = rd.result; enShow(0, 'avatar'); };
    rd.readAsDataURL(f);
  });
  document.querySelectorAll('[data-av]').forEach(b => b.addEventListener('click', () => {
    en.av = b.getAttribute('data-av'); en.photo = null; enShow(0, 'avatar');
  }));
  g('enSubmitAvatar') && g('enSubmitAvatar').addEventListener('click', () => {
    const first = en.data.nom.trim().split(/\s+/)[0] || 'Éclaireur';
    state.user = Object.assign({}, state.user, {
      name: first,
      handle: en.handle,
      email: en.data.email,
      tel: en.data.pays + ' ' + en.data.tel.trim(),
      pts: 0, streak: 0, acts: 0, sig: 0, myReports: [], myCleanups: []
    });
    if (en.photo) state.user.look = Object.assign({}, state.user.look, { photo: en.photo });
    state.myReports = []; state.myCleanups = [];
    state.history = []; state.settings = Object.assign({ notify:true, geo:true, reduced:false }, state.settings);
    save();
    enClose();
    toast('Bienvenue ' + first + ' · votre compte est prêt');
  });
}
function enSplash(){
  const root = document.getElementById('entry');
  root.classList.add('on', 'ed');
  /* Le drapeau est pose ici, pas a la fermeture : recharger le navigateur
     en plein parcours ne doit pas relancer le splash depuis le debut. */
  enMarkDone();
  document.body.style.overflow = 'hidden';
  root.innerHTML = '<div class="en en-splash on">' +
    '<span class="sp-mark">' + ic('leaf') + '</span>' +
    '<div class="sp-word">Green<b>shot</b></div>' +
    '<p class="sp-tag">Verdir Bujumbura, un geste à la fois</p>' +
    '<div class="sp-bar" aria-hidden="true"><i></i></div></div>';
  setTimeout(() => enShow(0, 'onboarding'), 1500);
}
/* Point d'entrée : la première ouverture seulement. */
function enStart(){
  en.step = 0; en.err = {}; en.touchedHandle = false; en.handle = '';
  enSplash();
}


/* Premiere ouverture : le parcours d'entree se joue une fois, puis plus jamais.
   Les reglages proposent de le rejouer pour la demonstration. */
if (!enSaved()) enStart();
</script>
</body>
</html>
